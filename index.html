<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 h-screen flex flex-col overflow-hidden text-slate-800 dark:text-slate-100 transition-colors">

    <!-- App Root Container -->
    <div id="app" class="flex-1 flex flex-col h-full w-full"></div>

    <script>
        // --- 1. Firebase設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyA6Dbr9A6AUexhH-iCUr3lyiXx-2I5vpY8",
            authDomain: "chats-36528.firebaseapp.com",
            projectId: "chats-36528",
            storageBucket: "chats-36528.firebasestorage.app",
            messagingSenderId: "971663710322",
            appId: "1:971663710322:web:ebab63bd30840517a6caeb"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const messaging = firebase.messaging();

        const VAPID_KEY = "YOUR_WEB_PUSH_VAPID_KEY_HERE"; 

        // --- 2. アプリケーション状態 ---
        const state = {
            isSignupMode: false,
            currentTab: 'chats',
            view: 'home',        // 'home' | 'chat' | 'settings'
            activeRoomId: null,
            selectedFile: null,
            tempAvatar: null,
            currentUserData: null,
            allUsers: [],
            dms: [],
            messages: [],
            readStatus: {},      
            lastMessages: {},    
            unsubscribeMessages: null,
            unsubscribeDMs: null,
            unsubscribeLastMsgs: []
        };

        const STORAGE_KEYS = { DARK_MODE: 'reach_dark_mode_v21' };
        function isDarkMode() { return localStorage.getItem(STORAGE_KEYS.DARK_MODE) === 'true'; }

        // --- 3. 画像リサイズ ---
        function resizeImage(file, maxWidth = 120, maxHeight = 120, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        function renderAvatar(user, sizeClass = 'w-10 h-10', textClass = 'text-sm') {
            if (user && user.avatar) {
                return `<img src="${user.avatar}" alt="${escapeHtml(user.name)}" class="${sizeClass} rounded-full object-cover shadow-sm border border-slate-200 dark:border-slate-700">`;
            }
            const initial = user && user.name ? user.name.charAt(0) : '?';
            return `<div class="${sizeClass} rounded-full bg-blue-500 text-white flex items-center justify-center font-bold shadow-sm ${textClass}">${initial}</div>`;
        }

        function getRoomId(id1, id2) {
            return [id1, id2].sort().join('_vs_');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>"]/g, (match) => {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                }[match];
            });
        }

        // --- 4. FCM通知権限の取得とトークン保存 ---
        async function requestNotificationPermission() {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');
                    const token = await messaging.getToken({
                        vapidKey: VAPID_KEY,
                        serviceWorkerRegistration: registration
                    });

                    if (token && auth.currentUser) {
                        await db.collection('users').doc(auth.currentUser.uid).update({
                            fcmToken: token
                        });
                    }
                }
            } catch (error) {
                console.error('FCMトークン取得エラー:', error);
            }
        }

        // --- 5. Firebase認証・データ同期 ---
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    state.currentUserData = doc.data();
                } else {
                    state.currentUserData = { uid: user.uid, loginId: user.email.split('@')[0], name: '名無し', friends: [], avatar: null };
                }
                fetchAllUsers();
                fetchDMsAndReadStatus();
                requestNotificationPermission();
            } else {
                state.currentUserData = null;
                if (state.unsubscribeMessages) state.unsubscribeMessages();
                if (state.unsubscribeDMs) state.unsubscribeDMs();
                state.unsubscribeLastMsgs.forEach(unsub => unsub());
                state.unsubscribeLastMsgs = [];
            }
            renderApp();
        });

        async function fetchAllUsers() {
            const snapshot = await db.collection('users').get();
            state.allUsers = snapshot.docs.map(doc => doc.data());
            renderApp();
        }

        function fetchDMsAndReadStatus() {
            if (!state.currentUserData) return;
            state.unsubscribeDMs = db.collection('dms')
              .where('members', 'array-contains', state.currentUserData.loginId)
              .onSnapshot(snapshot => {
                  state.dms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  
                  state.unsubscribeLastMsgs.forEach(unsub => unsub());
                  state.unsubscribeLastMsgs = [];

                  state.dms.forEach(room => {
                      const unsub = db.collection('messages').doc(room.id).collection('chats')
                          .orderBy('createdAt', 'desc')
                          .limit(1)
                          .onSnapshot(msgSnap => {
                              if (!msgSnap.empty) {
                                  state.lastMessages[room.id] = msgSnap.docs[0].data();
                              } else {
                                  state.lastMessages[room.id] = null;
                              }
                              renderApp();
                          });
                      state.unsubscribeLastMsgs.push(unsub);
                  });

                  renderApp();
              });

            db.collection('readStatus').onSnapshot(snapshot => {
                const statusMap = {};
                snapshot.docs.forEach(doc => {
                    statusMap[doc.id] = doc.data();
                });
                state.readStatus = statusMap;
                renderApp();
            });
        }

        function subscribeMessages(roomId) {
            if (state.unsubscribeMessages) state.unsubscribeMessages();
            state.unsubscribeMessages = db.collection('messages').doc(roomId).collection('chats')
                .orderBy('createdAt', 'desc')
                .limit(50)
                .onSnapshot(snapshot => {
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    state.messages = docs.reverse();
                    renderApp();
                    
                    if (state.messages.length > 0 && state.currentUserData) {
                        const lastMsg = state.messages[state.messages.length - 1];
                        markRoomAsRead(roomId, state.currentUserData.loginId, lastMsg.createdAt);
                    }

                    const container = document.getElementById('messageContainer');
                    if (container) container.scrollTop = container.scrollHeight;
                });
        }

        async function markRoomAsRead(roomId, loginId, msgTimestamp) {
            await db.collection('readStatus').doc(roomId).set({
                [loginId]: msgTimestamp
            }, { merge: true });
        }

        // --- 6. 描画ルーター ---
        window.renderApp = function() {
            if (isDarkMode()) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            const root = document.getElementById('app');
            if (!state.currentUserData) {
                root.innerHTML = renderAuthScreen();
            } else if (state.view === 'home') {
                root.innerHTML = renderHomeScreen(state.currentUserData);
            } else if (state.view === 'chat') {
                root.innerHTML = renderChatScreen(state.currentUserData);
            } else if (state.view === 'settings') {
                root.innerHTML = renderSettingsScreen(state.currentUserData);
            }

            lucide.createIcons();
            attachEvents();
        };

        function renderDarkModeButton() {
            const dark = isDarkMode();
            return `
                <button id="globalDarkModeToggleBtn" class="text-slate-500 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition" title="ダークモード切替">
                    ${dark ? '<i data-lucide="sun" class="w-5 h-5"></i>' : '<i data-lucide="moon" class="w-5 h-5"></i>'}
                </button>
            `;
        }

        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 dark:from-blue-950 dark:to-slate-900 p-4 relative">
                    <div class="absolute top-4 right-4">${renderDarkModeButton()}</div>
                    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-md p-8 flex flex-col space-y-6 border border-slate-100 dark:border-slate-800">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 bg-blue-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-blue-500/30">💬</div>
                            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Reach</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400">${state.isSignupMode ? '新規アカウント登録' : 'ログイン'}</p>
                        </div>
                        <form id="authForm" class="space-y-4">
                            ${state.isSignupMode ? `
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">表示名</label>
                                    <input type="text" id="displayNameInput" required placeholder="例: 山田 太郎" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">ログインID</label>
                                <input type="text" id="loginIdInput" required placeholder="例: abc123" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">パスワード (6文字以上)</label>
                                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 transition">
                                ${state.isSignupMode ? '登録してログイン' : 'ログイン'}
                            </button>
                        </form>
                        <div class="text-center">
                            <button id="toggleModeBtn" class="text-xs text-blue-600 dark:text-blue-400 hover:underline font-medium">
                                ${state.isSignupMode ? 'すでにアカウントをお持ちですか？ ログインへ' : 'アカウントをお持ちでない場合は新規登録'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHomeScreen(currentUser) {
            const friendUsers = state.allUsers.filter(u => (currentUser.friends || []).includes(u.loginId));

            let totalUnread = 0;
            state.dms.forEach(room => {
                const lastMsg = state.lastMessages[room.id];
                const roomReadInfo = state.readStatus[room.id] || {};
                const myLastRead = roomReadInfo[currentUser.loginId] || 0;
                if (lastMsg && lastMsg.senderId !== currentUser.loginId && lastMsg.createdAt > myLastRead && !lastMsg.unsent) {
                    totalUnread++;
                }
            });

            return `
                <div class="flex-1 flex flex-col h-full bg-white dark:bg-slate-900 max-w-xl mx-auto w-full shadow-lg border-x border-slate-200 dark:border-slate-800">
                    <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                        <div class="flex items-center space-x-3">
                            ${renderAvatar(currentUser, 'w-10 h-10', 'text-base')}
                            <div>
                                <h2 class="text-sm font-bold text-slate-800 dark:text-slate-100">${escapeHtml(currentUser.name)}</h2>
                                <p class="text-xs text-blue-600 dark:text-blue-400">ID: ${escapeHtml(currentUser.loginId)}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            ${renderDarkModeButton()}
                            <button id="goToSettingsBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="プロフィール設定">
                                <i data-lucide="settings" class="w-5 h-5"></i>
                            </button>
                            <button id="logoutBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="ログアウト">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/20 p-2">
                        <button data-tab="chats" class="flex-1 py-3 text-sm font-semibold rounded-xl transition relative ${state.currentTab === 'chats' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}">
                            トーク
                            ${totalUnread > 0 ? `<span class="absolute top-2 right-6 w-5 h-5 bg-blue-500 text-white text-[11px] font-bold rounded-full flex items-center justify-center">${totalUnread}</span>` : ''}
                        </button>
                        <button data-tab="friends" class="flex-1 py-3 text-sm font-semibold rounded-xl transition ${state.currentTab === 'friends' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}">
                            フレンド (${friendUsers.length})
                        </button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-4 space-y-2">
                        ${state.currentTab === 'chats' ? `
                            ${state.dms.length === 0 ? '<div class="text-center text-xs text-slate-400 py-12">「フレンド」タブから友達を選んでトークを始めましょう</div>' : ''}
                            ${state.dms.map(room => {
                                const partnerId = room.members.find(id => id !== currentUser.loginId);
                                const partner = state.allUsers.find(u => u.loginId === partnerId) || { name: partnerId, avatar: null };
                                const lastMsg = state.lastMessages[room.id];
                                const roomReadInfo = state.readStatus[room.id] || {};
                                const myLastRead = roomReadInfo[currentUser.loginId] || 0;
                                const hasUnread = lastMsg && lastMsg.senderId !== currentUser.loginId && lastMsg.createdAt > myLastRead && !lastMsg.unsent;

                                return `
                                    <div data-room-id="${room.id}" class="room-item flex items-center justify-between p-3.5 rounded-2xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60 border border-slate-100 dark:border-slate-800 transition shadow-sm">
                                        <div class="flex items-center space-x-3.5 min-w-0 flex-1">
                                            ${renderAvatar(partner, 'w-12 h-12', 'text-lg')}
                                            <div class="flex-1 min-w-0 pr-2">
                                                <div class="flex items-center justify-between mb-0.5">
                                                    <span class="font-bold text-slate-800 dark:text-slate-100 text-sm truncate">${escapeHtml(partner.name)}</span>
                                                    ${lastMsg ? `<span class="text-[11px] text-slate-400 flex-shrink-0">${escapeHtml(lastMsg.time)}</span>` : ''}
                                                </div>
                                                <div class="text-xs text-slate-500 dark:text-slate-400 truncate">
                                                    ${lastMsg ? (lastMsg.unsent ? 'メッセージの送信を取り消しました' : (lastMsg.file ? `📎 [ファイル] ${escapeHtml(lastMsg.file.name)}` : escapeHtml(lastMsg.text))) : 'メッセージなし'}
                                                </div>
                                            </div>
                                        </div>
                                        ${hasUnread ? `<span class="w-3 h-3 bg-blue-500 rounded-full flex-shrink-0 ml-2"></span>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        ` : `
                            <div class="p-3 mb-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800 space-y-2">
                                <div class="text-xs font-bold text-slate-700 dark:text-slate-300">＋ IDで友達追加（相互追加）</div>
                                <form id="addFriendForm" class="flex space-x-2">
                                    <input type="text" id="friendIdInput" placeholder="相手のログインID" class="flex-1 px-3.5 py-2.5 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <button type="submit" class="px-4 py-2.5 bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold rounded-xl shadow-sm">追加</button>
                                </form>
                            </div>
                            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1 mb-2">フレンド一覧</div>
                            ${friendUsers.map(u => `
                                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800 shadow-sm mb-2">
                                    <div class="flex items-center space-x-3.5">
                                        ${renderAvatar(u, 'w-11 h-11', 'text-base')}
                                        <div>
                                            <div class="text-sm font-bold text-slate-800 dark:text-slate-100">${escapeHtml(u.name)}</div>
                                            <div class="text-xs text-slate-400">ID: ${escapeHtml(u.loginId)}</div>
                                        </div>
                                    </div>
                                    <button data-start-chat="${escapeHtml(u.loginId)}" class="start-chat-btn px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold rounded-xl shadow-sm transition">トーク</button>
                                </div>
                            `).join('')}
                        `}
                    </div>
                </div>
            `;
        }

        function renderSettingsScreen(currentUser) {
            const displayAvatar = state.tempAvatar !== null ? state.tempAvatar : currentUser.avatar;

            return `
                <div class="flex-1 flex flex-col h-full bg-white dark:bg-slate-900 max-w-xl mx-auto w-full shadow-lg border-x border-slate-200 dark:border-slate-800">
                    <div class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between shadow-sm flex-shrink-0">
                        <div class="flex items-center space-x-3">
                            <button id="backToHomeFromSettingsBtn" class="p-2 -ml-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition flex items-center space-x-1">
                                <i data-lucide="chevron-left" class="w-6 h-6"></i>
                                <span class="text-sm font-semibold">戻る</span>
                            </button>
                            <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base">プロフィール設定</h3>
                        </div>
                        <div>${renderDarkModeButton()}</div>
                    </div>

                    <div class="flex-1 overflow-y-auto p-6">
                        <form id="profileForm" class="space-y-6 max-w-md mx-auto">
                            <div class="text-center pb-4 border-b border-slate-100 dark:border-slate-800 space-y-3">
                                <div class="relative w-24 h-24 mx-auto">
                                    ${displayAvatar ? `<img src="${displayAvatar}" class="w-24 h-24 rounded-full object-cover shadow-md border-2 border-blue-500">` : `<div class="w-24 h-24 rounded-full bg-blue-500 text-white text-3xl font-bold flex items-center justify-center mx-auto shadow-md">${escapeHtml(currentUser.name.charAt(0))}</div>`}
                                </div>
                                <div>
                                    <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
                                    <button type="button" id="triggerAvatarBtn" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition shadow-sm">
                                        📷 画像を変更
                                    </button>
                                </div>
                                <div class="text-xs text-slate-400">ID: <span class="font-mono font-semibold text-slate-600 dark:text-slate-300">${escapeHtml(currentUser.loginId)}</span></div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">表示名</label>
                                <input type="text" id="editNameInput" value="${escapeHtml(currentUser.name)}" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/20 transition">
                                変更を保存する
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderFileContent(file, isSelf) {
            if (file.type && file.type.startsWith('image/')) {
                return `<div class="mt-1"><img src="${file.data}" alt="${escapeHtml(file.name)}" class="max-w-xs rounded-xl max-h-48 object-cover cursor-pointer shadow-sm"></div>`;
            }
            return `
                <div class="mt-1 flex items-center space-x-2 bg-black/10 dark:bg-white/10 p-2 rounded-xl text-xs">
                    <i data-lucide="file" class="w-4 h-4 flex-shrink-0"></i>
                    <a href="${file.data}" download="${escapeHtml(file.name)}" class="underline truncate font-medium hover:opacity-80">${escapeHtml(file.name)}</a>
                </div>
            `;
        }

        function renderChatScreen(currentUser) {
            if (state.activeRoomId) {
                subscribeMessages(state.activeRoomId);
            }

            const activeRoom = state.dms.find(r => r.id === state.activeRoomId);
            const partnerLoginId = activeRoom ? activeRoom.members.find(id => id !== currentUser.loginId) : null;
            const activePartner = state.allUsers.find(u => u.loginId === partnerLoginId) || { name: '不明', loginId: '', avatar: null };

            const roomReadInfo = state.readStatus[state.activeRoomId] || {};
            const partnerLastRead = roomReadInfo[partnerLoginId] || 0;

            return `
                <div class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-950 max-w-xl mx-auto w-full shadow-lg border-x border-slate-200 dark:border-slate-800">
                    <div class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between shadow-sm flex-shrink-0">
                        <div class="flex items-center space-x-3">
                            <button id="backToHomeBtn" class="p-2 -ml-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition flex items-center space-x-1">
                                <i data-lucide="chevron-left" class="w-6 h-6"></i>
                                <span class="text-sm font-semibold">戻る</span>
                            </button>
                            <div class="flex items-center space-x-2">
                                ${renderAvatar(activePartner, 'w-9 h-9', 'text-sm')}
                                <div>
                                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm">${escapeHtml(activePartner.name)}</h3>
                                    <p class="text-[10px] text-slate-400">ID: ${escapeHtml(activePartner.loginId)}</p>
                                </div>
                            </div>
                        </div>
                        <div>${renderDarkModeButton()}</div>
                    </div>

                    <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                        ${state.messages.length === 0 ? '<div class="text-center text-xs text-slate-400 py-10">メッセージやファイルを送信してみましょう！</div>' : ''}
                        ${state.messages.map(m => {
                            const isSelf = m.senderId === currentUser.loginId;
                            const isRead = isSelf && partnerLastRead && m.createdAt <= partnerLastRead;

                            if (m.unsent) {
                                return `
                                    <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
                                        <div class="px-4 py-2 rounded-xl text-xs bg-slate-200/60 dark:bg-slate-800 text-slate-400 italic">
                                            メッセージの送信を取り消しました
                                        </div>
                                    </div>
                                `;
                            }

                            return `
                                <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'} group">
                                    <span class="text-xs text-slate-400 mb-1 px-1">${escapeHtml(m.senderName)}</span>
                                    <div class="flex items-end space-x-2 max-w-[85%] ${isSelf ? 'flex-row-reverse space-x-reverse' : ''}">
                                        <div class="px-4 py-2.5 rounded-2xl text-sm shadow-sm ${isSelf ? 'bg-blue-500 text-white rounded-br-none' : 'bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-bl-none border border-slate-100 dark:border-slate-800'}">
                                            ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ''}
                                            ${m.file ? renderFileContent(m.file, isSelf) : ''}
                                        </div>
                                        <div class="flex flex-col items-end text-[10px] text-slate-400 flex-shrink-0">
                                            ${isSelf && isRead ? '<span class="text-blue-600 dark:text-blue-400 font-bold">既読</span>' : ''}
                                            <span>${escapeHtml(m.time)}</span>
                                        </div>
                                        ${isSelf ? `
                                            <button data-unsend-id="${escapeHtml(m.id)}" class="unsend-btn opacity-0 group-hover:opacity-100 transition text-[11px] text-slate-400 hover:text-red-400 px-1" title="送信取り消し">
                                                取り消し
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    ${state.selectedFile ? `
                        <div class="bg-blue-50 dark:bg-blue-950/60 border-t border-blue-200 dark:border-blue-800 px-4 py-2 flex items-center justify-between text-xs text-blue-800 dark:text-blue-300">
                            <div class="flex items-center space-x-2 truncate">
                                <i data-lucide="paperclip" class="w-4 h-4 flex-shrink-0"></i>
                                <span class="font-bold truncate">${escapeHtml(state.selectedFile.name)}</span>
                            </div>
                            <button id="cancelFileBtn" class="text-slate-400 hover:text-red-500 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                    ` : ''}

                    <div class="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center space-x-2">
                        <input type="file" id="chatFileInput" class="hidden">
                        <button id="triggerChatFileBtn" class="p-2.5 text-slate-400 hover:text-blue-500 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="ファイルを添付">
                            <i data-lucide="paperclip" class="w-5 h-5"></i>
                        </button>
                        <form id="messageForm" class="flex-1 flex space-x-2">
                            <input type="text" id="messageInput" placeholder="メッセージを入力..." class="flex-1 px-4 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent dark:border-slate-700">
                            <button type="submit" class="px-4 py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-xl shadow-sm transition flex items-center justify-center">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        // --- 7. イベントハンドラ ---
        function attachEvents() {
            const globalDarkBtn = document.getElementById('globalDarkModeToggleBtn');
            if (globalDarkBtn) {
                globalDarkBtn.onclick = () => {
                    const current = isDarkMode();
                    localStorage.setItem(STORAGE_KEYS.DARK_MODE, !current);
                    renderApp();
                };
            }

            const toggleModeBtn = document.getElementById('toggleModeBtn');
            if (toggleModeBtn) {
                toggleModeBtn.onclick = () => {
                    state.isSignupMode = !state.isSignupMode;
                    renderApp();
                };
            }

            const authForm = document.getElementById('authForm');
            if (authForm) {
                authForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const loginId = document.getElementById('loginIdInput').value.trim();
                    const password = document.getElementById('passwordInput').value;
                    const email = `${loginId}@shinagawa.org`;

                    try {
                        if (state.isSignupMode) {
                            const displayName = document.getElementById('displayNameInput').value.trim();
                            const cred = await auth.createUserWithEmailAndPassword(email, password);
                            await db.collection('users').doc(cred.user.uid).set({
                                uid: cred.user.uid,
                                loginId: loginId,
                                name: displayName,
                                friends: [],
                                avatar: null
                            });
                        } else {
                            await auth.signInWithEmailAndPassword(email, password);
                        }
                    } catch (err) {
                        alert('認証エラー: ' + err.message);
                    }
                };
            }

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.onclick = () => auth.signOut();
            }

            const goToSettingsBtn = document.getElementById('goToSettingsBtn');
            if (goToSettingsBtn) {
                goToSettingsBtn.onclick = () => {
                    state.view = 'settings';
                    state.tempAvatar = null;
                    renderApp();
                };
            }

            const backToHomeFromSettingsBtn = document.getElementById('backToHomeFromSettingsBtn');
            if (backToHomeFromSettingsBtn) {
                backToHomeFromSettingsBtn.onclick = () => {
                    state.view = 'home';
                    state.tempAvatar = null;
                    renderApp();
                };
            }

            document.querySelectorAll('[data-tab]').forEach(btn => {
                btn.onclick = () => {
                    state.currentTab = btn.getAttribute('data-tab');
                    renderApp();
                };
            });

            const addFriendForm = document.getElementById('addFriendForm');
            if (addFriendForm) {
                addFriendForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const targetId = document.getElementById('friendIdInput').value.trim();
                    if (!targetId || targetId === state.currentUserData.loginId) {
                        alert('有効なログインIDを入力してください。');
                        return;
                    }

                    const targetUser = state.allUsers.find(u => u.loginId === targetId);
                    if (!targetUser) {
                        alert('ユーザーが見つかりませんでした。');
                        return;
                    }

                    const myFriends = state.currentUserData.friends || [];
                    if (myFriends.includes(targetId)) {
                        alert('すでにフレンドです。');
                        return;
                    }

                    try {
                        const myUid = auth.currentUser.uid;
                        const targetUid = targetUser.uid;

                        const newMyFriends = [...myFriends, targetId];
                        const targetFriends = targetUser.friends || [];
                        const newTargetFriends = [...targetFriends, state.currentUserData.loginId];

                        await db.collection('users').doc(myUid).update({ friends: newMyFriends });
                        await db.collection('users').doc(targetUid).update({ friends: newTargetFriends });

                        state.currentUserData.friends = newMyFriends;
                        targetUser.friends = newTargetFriends;

                        const roomId = getRoomId(state.currentUserData.loginId, targetId);
                        await db.collection('dms').doc(roomId).set({
                            members: [state.currentUserData.loginId, targetId],
                            createdAt: Date.now()
                        }, { merge: true });

                        alert('フレンドに追加しました！');
                        renderApp();
                    } catch (err) {
                        alert('エラー: ' + err.message);
                    }
                };
            }

            document.querySelectorAll('.start-chat-btn').forEach(btn => {
                btn.onclick = () => {
                    const targetLoginId = btn.getAttribute('data-start-chat');
                    const roomId = getRoomId(state.currentUserData.loginId, targetLoginId);
                    state.activeRoomId = roomId;
                    state.view = 'chat';
                    renderApp();
                };
            });

            document.querySelectorAll('.room-item').forEach(item => {
                item.onclick = () => {
                    const roomId = item.getAttribute('data-room-id');
                    state.activeRoomId = roomId;
                    state.view = 'chat';
                    renderApp();
                };
            });

            const backToHomeBtn = document.getElementById('backToHomeBtn');
            if (backToHomeBtn) {
                backToHomeBtn.onclick = () => {
                    if (state.unsubscribeMessages) {
                        state.unsubscribeMessages();
                        state.unsubscribeMessages = null;
                    }
                    state.activeRoomId = null;
                    state.view = 'home';
                    renderApp();
                };
            }

            const triggerAvatarBtn = document.getElementById('triggerAvatarBtn');
            const avatarFileInput = document.getElementById('avatarFileInput');
            if (triggerAvatarBtn && avatarFileInput) {
                triggerAvatarBtn.onclick = () => avatarFileInput.click();
                avatarFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        state.tempAvatar = await resizeImage(file, 150, 150, 0.8);
                        renderApp();
                    }
                };
            }

            const profileForm = document.getElementById('profileForm');
            if (profileForm) {
                profileForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const newName = document.getElementById('editNameInput').value.trim();
                    const updateData = { name: newName };
                    if (state.tempAvatar !== null) {
                        updateData.avatar = state.tempAvatar;
                    }

                    try {
                        await db.collection('users').doc(auth.currentUser.uid).update(updateData);
                        state.currentUserData.name = newName;
                        if (updateData.avatar) state.currentUserData.avatar = updateData.avatar;
                        state.tempAvatar = null;
                        alert('プロフィールを更新しました！');
                        state.view = 'home';
                        renderApp();
                    } catch (err) {
                        alert('エラー: ' + err.message);
                    }
                };
            }

            const triggerChatFileBtn = document.getElementById('triggerChatFileBtn');
            const chatFileInput = document.getElementById('chatFileInput');
            if (triggerChatFileBtn && chatFileInput) {
                triggerChatFileBtn.onclick = () => chatFileInput.click();
                chatFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        let fileData;
                        if (file.type.startsWith('image/')) {
                            fileData = await resizeImage(file, 800, 800, 0.7);
                        } else {
                            fileData = await new Promise((res) => {
                                const r = new FileReader();
                                r.onload = (ev) => res(ev.target.result);
                                r.readAsDataURL(file);
                            });
                        }
                        state.selectedFile = { name: file.name, type: file.type, data: fileData };
                        renderApp();
                    }
                };
            }

            const cancelFileBtn = document.getElementById('cancelFileBtn');
            if (cancelFileBtn) {
                cancelFileBtn.onclick = () => {
                    state.selectedFile = null;
                    renderApp();
                };
            }

            const messageForm = document.getElementById('messageForm');
            if (messageForm) {
                messageForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const input = document.getElementById('messageInput');
                    const text = input.value.trim();
                    if (!text && !state.selectedFile) return;

                    const msgData = {
                        senderId: state.currentUserData.loginId,
                        senderName: state.currentUserData.name,
                        text: text,
                        file: state.selectedFile,
                        createdAt: Date.now(),
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        unsent: false
                    };

                    const roomId = state.activeRoomId;
                    input.value = '';
                    state.selectedFile = null;

                    try {
                        await db.collection('messages').doc(roomId).collection('chats').add(msgData);
                    } catch (err) {
                        alert('送信エラー: ' + err.message);
                    }
                };
            }

            document.querySelectorAll('.unsend-btn').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const msgId = btn.getAttribute('data-unsend-id');
                    if (confirm('このメッセージを取り消しますか？')) {
                        try {
                            await db.collection('messages').doc(state.activeRoomId).collection('chats').doc(msgId).update({
                                unsent: true,
                                text: '',
                                file: null
                            });
                        } catch (err) {
                            alert('エラー: ' + err.message);
                        }
                    }
                };
            });
        }
    </script>
</body>
</html>
