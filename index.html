<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 h-screen flex flex-col overflow-hidden text-slate-800 dark:text-slate-100 transition-colors">

    <!-- App Root Container -->
    <div id="app" class="flex-1 flex flex-col h-full w-full"></div>

    <script>
        // --- 1. Firebase設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyA6Dbr9A6AUexhH-iCUr3lyiXx-2I5vpY8",
            authDomain: "chats-36528.firebaseapp.com",
            projectId: "chats-36528",
            storageBucket: "chats-36528.firebasestorage.app",
            messagingSenderId: "971663710322",
            appId: "1:971663710322:web:ebab63bd30840517a6caeb"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- 2. アプリケーション状態 ---
        const state = {
            isSignupMode: false,
            currentTab: 'chats',
            view: 'home',        // 'home' | 'chat' | 'settings' | 'details'
            activeRoomId: null,
            selectedFile: null,
            tempAvatar: null,
            tempGroupAvatar: null,
            currentUserData: null,
            allUsers: [],
            dms: [],
            messages: [],
            unsubscribeMessages: null,
            isGroupModalOpen: false,
            isGroupEditModalOpen: false
        };

        const STORAGE_KEYS = { DARK_MODE: 'reach_dark_mode_v21' };
        function isDarkMode() { return localStorage.getItem(STORAGE_KEYS.DARK_MODE) === 'true'; }

        // --- 3. 画像リサイズ・アバター描画 ---
        function resizeImage(file, maxWidth = 120, maxHeight = 120, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        function renderAvatar(userOrGroup, sizeClass = 'w-10 h-10', textClass = 'text-sm') {
            if (userOrGroup && userOrGroup.avatar) {
                return `<img src="${userOrGroup.avatar}" alt="${escapeHtml(userOrGroup.name)}" class="${sizeClass} rounded-full object-cover shadow-sm border border-slate-200 dark:border-slate-700">`;
            }
            if (userOrGroup && userOrGroup.type === 'group') {
                return `<div class="${sizeClass} rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold shadow-sm ${textClass}">👥</div>`;
            }
            const initial = userOrGroup && userOrGroup.name ? userOrGroup.name.charAt(0) : '?';
            return `<div class="${sizeClass} rounded-full bg-blue-500 text-white flex items-center justify-center font-bold shadow-sm ${textClass}">${initial}</div>`;
        }

        function getRoomId(id1, id2) {
            return [id1, id2].sort().join('_vs_');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>"]/g, (match) => {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                }[match];
            });
        }

        // --- 4. Firebase認証・データ取得 ---
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        state.currentUserData = doc.data();
                    } else {
                        state.currentUserData = { uid: user.uid, loginId: user.email.split('@')[0], name: '名無し', friends: [], avatar: null };
                    }
                    await fetchAllUsers();
                    await fetchDMsOnce();
                } catch (err) {
                    console.error("データ取得エラー:", err);
                }
            } else {
                state.currentUserData = null;
                if (state.unsubscribeMessages) state.unsubscribeMessages();
            }
            renderApp();
        });

        async function fetchAllUsers() {
            try {
                const snapshot = await db.collection('users').get();
                state.allUsers = snapshot.docs.map(doc => doc.data());
            } catch (err) {
                console.error("ユーザー一覧取得エラー:", err);
            }
        }

        async function fetchDMsOnce() {
            if (!state.currentUserData) return;
            try {
                const snapshot = await db.collection('dms')
                  .where('members', 'array-contains', state.currentUserData.loginId)
                  .get();
                
                let fetchedDms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const friends = state.currentUserData.friends || [];
                friends.forEach(friendId => {
                    const roomId = getRoomId(state.currentUserData.loginId, friendId);
                    const exists = fetchedDms.some(d => d.id === roomId);
                    if (!exists) {
                        fetchedDms.push({
                            id: roomId,
                            type: 'dm',
                            members: [state.currentUserData.loginId, friendId],
                            lastMessage: 'タップしてチャットを始めましょう',
                            lastMessageTime: 0,
                            lastSenderId: '',
                            unread: false
                        });
                    }
                });

                fetchedDms.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));

                state.dms = fetchedDms.slice(0, 10);
                state.allDmsCount = fetchedDms.length;
            } catch (err) {
                console.error("DM一覧取得エラー:", err);
            }
        }

        function subscribeMessages(roomId) {
            if (state.unsubscribeMessages) state.unsubscribeMessages();
            state.unsubscribeMessages = db.collection('messages').doc(roomId).collection('chats')
                .orderBy('createdAt', 'desc')
                .limit(50)
                .onSnapshot(snapshot => {
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    state.messages = docs.reverse();
                    
                    if (state.view === 'chat') {
                        updateChatMessagesOnly();
                    } else {
                        renderApp();
                    }
                });
        }

        function updateChatMessagesOnly() {
            const container = document.getElementById('messageContainer');
            if (!container) return;

            const currentUser = state.currentUserData;
            container.innerHTML = state.messages.length === 0 
                ? '<div class="text-center text-xs text-slate-400 py-10">メッセージやファイルを送信してみましょう！</div>' 
                : state.messages.map(m => {
                    const isSelf = m.senderId === currentUser.loginId;
                    if (m.unsent) {
                        return `
                            <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
                                <div class="px-4 py-2 rounded-xl text-xs bg-slate-200/60 dark:bg-slate-800 text-slate-400 italic">
                                    メッセージの送信を取り消しました
                                </div>
                            </div>
                        `;
                    }
                    return `
                        <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'} group">
                            <span class="text-xs text-slate-400 mb-1 px-1">${escapeHtml(m.senderName)}</span>
                            <div class="flex items-end space-x-2 max-w-[85%] ${isSelf ? 'flex-row-reverse space-x-reverse' : ''}">
                                <div class="px-4 py-2.5 rounded-2xl text-sm shadow-sm ${isSelf ? 'bg-blue-500 text-white rounded-br-none' : 'bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-bl-none border border-slate-100 dark:border-slate-800'}">
                                    ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ''}
                                    ${m.file ? renderFileContent(m.file) : ''}
                                </div>
                                <div class="flex flex-col items-end text-[10px] text-slate-400 flex-shrink-0">
                                    <span>${escapeHtml(m.time)}</span>
                                </div>
                                ${isSelf ? `
                                    <button data-unsend-id="${escapeHtml(m.id)}" class="unsend-btn opacity-0 group-hover:opacity-100 transition text-[11px] text-slate-400 hover:text-red-400 px-1" title="送信取り消し">
                                        取り消し
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            container.scrollTop = container.scrollHeight;
            lucide.createIcons();
            attachUnsendEvents();
        }

        // --- 5. 描画ルーター ---
        window.renderApp = function() {
            if (isDarkMode()) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            const root = document.getElementById('app');
            if (!state.currentUserData) {
                root.innerHTML = renderAuthScreen();
            } else if (state.view === 'home') {
                root.innerHTML = renderHomeScreen(state.currentUserData);
            } else if (state.view === 'chat') {
                root.innerHTML = renderChatScreen(state.currentUserData);
            } else if (state.view === 'settings') {
                root.innerHTML = renderSettingsScreen(state.currentUserData);
            } else if (state.view === 'details') {
                root.innerHTML = renderDetailsScreen(state.currentUserData);
            }

            lucide.createIcons();
            attachEvents();
        };

        function renderDarkModeButton() {
            const dark = isDarkMode();
            return `
                <button id="globalDarkModeToggleBtn" class="text-slate-500 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition" title="ダークモード切替">
                    ${dark ? '<i data-lucide="sun" class="w-5 h-5"></i>' : '<i data-lucide="moon" class="w-5 h-5"></i>'}
                </button>
            `;
        }

        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 dark:from-blue-950 dark:to-slate-900 p-4 relative">
                    <div class="absolute top-4 right-4">${renderDarkModeButton()}</div>
                    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-md p-8 flex flex-col space-y-6 border border-slate-100 dark:border-slate-800">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 bg-blue-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-blue-500/30">💬</div>
                            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Reach</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400">${state.isSignupMode ? '新規アカウント登録' : 'ログイン'}</p>
                        </div>
                        <form id="authForm" class="space-y-4">
                            ${state.isSignupMode ? `
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">表示名</label>
                                    <input type="text" id="displayNameInput" required placeholder="例: 山田 太郎" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">ログインID</label>
                                <input type="text" id="loginIdInput" required placeholder="例: abc123" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">パスワード (6文字以上)</label>
                                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 transition">
                                ${state.isSignupMode ? '登録してログイン' : 'ログイン'}
                            </button>
                        </form>
                        <div class="text-center">
                            <button id="toggleModeBtn" class="text-xs text-blue-600 dark:text-blue-400 hover:underline font-medium">
                                ${state.isSignupMode ? 'すでにアカウントをお持ちですか？ ログインへ' : 'アカウントをお持ちでない場合は新規登録'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHomeScreen(currentUser) {
            const friendUsers = state.allUsers.filter(u => (currentUser.friends || []).includes(u.loginId));

            return `
                <div class="flex-1 flex flex-col h-full bg-white dark:bg-slate-900 max-w-xl mx-auto w-full shadow-lg border-x border-slate-200 dark:border-slate-800 relative">
                    <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                        <div class="flex items-center space-x-3">
                            ${renderAvatar(currentUser, 'w-10 h-10', 'text-base')}
                            <div>
                                <h2 class="text-sm font-bold text-slate-800 dark:text-slate-100">${escapeHtml(currentUser.name)}</h2>
                                <p class="text-xs text-blue-600 dark:text-blue-400">ID: ${escapeHtml(currentUser.loginId)}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            ${renderDarkModeButton()}
                            <button id="goToSettingsBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="プロフィール設定">
                                <i data-lucide="settings" class="w-5 h-5"></i>
                            </button>
                            <button id="logoutBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="ログアウト">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/20 p-2">
                        <button data-tab="chats" class="flex-1 py-3 text-sm font-semibold rounded-xl transition ${state.currentTab === 'chats' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}">
                            トーク
                        </button>
                        <button data-tab="friends" class="flex-1 py-3 text-sm font-semibold rounded-xl transition ${state.currentTab === 'friends' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}">
                            フレンド (${friendUsers.length})
                        </button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-4 space-y-2">
                        ${state.currentTab === 'chats' ? `
                            ${state.dms.length === 0 ? '<div class="text-center text-xs text-slate-400 py-12">「フレンド」タブから友達を選んでトークを始めましょう</div>' : ''}
                            ${state.dms.map(room => {
                                const isGroup = room.type === 'group';
                                let displayName = room.name || 'グループチャット';
                                let displayUserOrGroup = room;

                                if (!isGroup) {
                                    const partnerId = room.members.find(id => id !== currentUser.loginId);
                                    displayUserOrGroup = state.allUsers.find(u => u.loginId === partnerId) || { name: partnerId, avatar: null };
                                    displayName = displayUserOrGroup.name;
                                }

                                const isUnread = room.lastSenderId && room.lastSenderId !== currentUser.loginId && room.unread === true;

                                return `
                                    <div data-room-id="${room.id}" class="room-item flex items-center justify-between p-3.5 rounded-2xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60 border border-slate-100 dark:border-slate-800 transition shadow-sm">
                                        <div class="flex items-center space-x-3.5 min-w-0 flex-1">
                                            ${renderAvatar(displayUserOrGroup, 'w-12 h-12', 'text-lg')}
                                            <div class="flex-1 min-w-0 pr-2">
                                                <div class="flex items-center justify-between">
                                                    <div class="font-bold text-slate-800 dark:text-slate-100 text-sm truncate">${escapeHtml(displayName)} ${isGroup ? `<span class="text-xs font-normal text-slate-400">(${room.members.length})</span>` : ''}</div>
                                                    ${isUnread ? '<span class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">新着</span>' : ''}
                                                </div>
                                                <div class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(room.lastMessage || 'タップしてチャットを開く')}</div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                            ${(state.allDmsCount || 0) > 10 ? `
                                <div class="text-center pt-3 pb-2">
                                    <button id="goToDetailsBtn" class="text-xs text-blue-500 hover:underline font-semibold">すべての過去履歴を見る (Details)</button>
                                </div>
                            ` : ''}
                        ` : `
                            <div class="flex justify-between items-center pb-2">
                                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">フレンド操作</div>
                                <button id="openCreateGroupBtn" class="px-3 py-1.5 bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-semibold rounded-xl shadow-sm transition flex items-center space-x-1">
                                    <span>＋ グループを作成</span>
                                </button>
                            </div>

                            <div class="p-3 mb-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800 space-y-2">
                                <div class="text-xs font-bold text-slate-700 dark:text-slate-300">＋ IDで友達追加（相互追加）</div>
                                <form id="addFriendForm" class="flex space-x-2">
                                    <input type="text" id="friendIdInput" placeholder="相手のログインID" class="flex-1 px-3.5 py-2.5 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <button type="submit" class="px-4 py-2.5 bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold rounded-xl shadow-sm">追加</button>
                                </form>
                            </div>

                            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1 mb-2">フレンド一覧</div>
                            ${friendUsers.map(u => `
                                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800 shadow-sm mb-2">
                                    <div class="flex items-center space-x-3.5">
                                        ${renderAvatar(u, 'w-11 h-11', 'text-base')}
                                        <div>
                                            <div class="text-sm font-bold text-slate-800 dark:text-slate-100">${escapeHtml(u.name)}</div>
                                            <div class="text-xs text-slate-400">ID: ${escapeHtml(u.loginId)}</div>
                                        </div>
                                    </div>
                                    <button data-start-chat="${escapeHtml(u.loginId)}" class="start-chat-btn px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold rounded-xl shadow-sm transition">トーク</button>
                                </div>
                            `).join('')}
                        `}
                    </div>

                    ${renderGroupModal(friendUsers)}
                    ${renderGroupEditModal()}
                </div>
            `;
        }

        // --- 新規グループ作成モーダル ---
        function renderGroupModal(friendUsers) {
            if (!state.isGroupModalOpen) return '';
            const avatarDisplay = state.tempGroupAvatar ? `<img src="${state.tempGroupAvatar}" class="w-16 h-16 rounded-full object-cover mx-auto">` : `<div class="w-16 h-16 rounded-full bg-indigo-500 text-white text-2xl font-bold flex items-center justify-center mx-auto">👥</div>`;

            return `
                <div class="absolute inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-100 dark:border-slate-800 space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                            <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base">新しいグループを作成</h3>
                            <button id="closeGroupModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form id="createGroupForm" class="space-y-4">
                            <div class="text-center space-y-2">
                                ${avatarDisplay}
                                <input type="file" id="groupAvatarFileInput" accept="image/*" class="hidden">
                                <button type="button" id="triggerGroupAvatarBtn" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 text-xs font-bold rounded-xl">📷 アイコン設定</button>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">グループ名</label>
                                <input type="text" id="groupNameInput" required placeholder="例: チームA" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">メンバーを選択</label>
                                <div class="max-h-40 overflow-y-auto space-y-2 border border-slate-200 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-800/30">
                                    ${friendUsers.length === 0 ? '<div class="text-xs text-slate-400">フレンドが追加されていません</div>' : ''}
                                    ${friendUsers.map(u => `
                                        <label class="flex items-center space-x-3 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 p-1.5 rounded-lg transition">
                                            <input type="checkbox" name="groupMembers" value="${escapeHtml(u.loginId)}" class="w-4 h-4 text-indigo-600 rounded">

        async function fetchAllDMsForDetails() {
            if (!state.currentUserData) return;
            try {
                const snapshot = await db.collection('dms')
                  .where('members', 'array-contains', state.currentUserData.loginId)
                  .get();
                let allDms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const friends = state.currentUserData.friends || [];
                friends.forEach(friendId => {
                    const roomId = getRoomId(state.currentUserData.loginId, friendId);
                    if (!allDms.some(d => d.id === roomId)) {
                        allDms.push({
                            id: roomId,
                            type: 'dm',
                            members: [state.currentUserData.loginId, friendId],
                            lastMessage: 'タップしてチャットを始めましょう',
                            lastMessageTime: 0,
                            lastSenderId: '',
                            unread: false
                        });
                    }
                });

                allDms.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
                
                const container = document.getElementById('detailsListContainer');
                if (!container) return;

                if (allDms.length === 0) {
                    container.innerHTML = '<div class="text-center text-xs text-slate-400 py-12">トーク履歴がありません</div>';
                    return;
                }

                container.innerHTML = allDms.map(room => {
                    const isGroup = room.type === 'group';
                    let displayName = room.name || 'グループチャット';
                    let displayUserOrGroup = room;

                    if (!isGroup) {
                        const partnerId = room.members.find(id => id !== state.currentUserData.loginId);
                        displayUserOrGroup = state.allUsers.find(u => u.loginId === partnerId) || { name: partnerId, avatar: null };
                        displayName = displayUserOrGroup.name;
                    }

                    const isUnread = room.lastSenderId && room.lastSenderId !== state.currentUserData.loginId && room.unread === true;

                    return `
                        <div data-room-id="${room.id}" class="room-item flex items-center justify-between p-3.5 rounded-2xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60 border border-slate-100 dark:border-slate-800 transition shadow-sm">
                            <div class="flex items-center space-x-3.5 min-w-0 flex-1">
                                ${renderAvatar(displayUserOrGroup, 'w-12 h-12', 'text-lg')}
                                <div class="flex-1 min-w-0 pr-2">
                                    <div class="flex items-center justify-between">
                                        <div class="font-bold text-slate-800 dark:text-slate-100 text-sm truncate">${escapeHtml(displayName)} ${isGroup ? `<span class="text-xs font-normal text-slate-400">(${room.members.length})</span>` : ''}</div>
                                        ${isUnread ? '<span class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">新着</span>' : ''}
                                    </div>
                                    <div class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(room.lastMessage || 'タップしてチャットを開く')}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('.room-item').forEach(item => {
                    item.onclick = async () => {
                        const roomId = item.getAttribute('data-room-id');
                        state.activeRoomId = roomId;
                        state.view = 'chat';
                        state.messages = [];
                        try {
                            await db.collection('dms').doc(roomId).update({ unread: false });
                        } catch(e){}
                        renderApp();
                    };
                });
                lucide.createIcons();
            } catch (err) {
                console.error("Details取得エラー:", err);
            }
        }

        function attachUnsendEvents() {
            document.querySelectorAll('.unsend-btn').forEach(btn => {

                    if (confirm('このメッセージを取り消しますか？')) {
                        try {
                            await db.collection('messages').doc(state.activeRoomId).collection('chats').doc(msgId).update({
                                unsent: true,
                                text: '',
                                file: null
                            });
                        } catch (err) {
                            alert('エラー: ' + err.message);
                        }
                    }
                };
            });
        }

        // --- 6. イベントハンドラ ---
        function attachEvents() {
            const globalDarkBtn = document.getElementById('globalDarkModeToggleBtn');
            if (globalDarkBtn) {
                globalDarkBtn.onclick = () => {
                    const current = isDarkMode();
                    localStorage.setItem(STORAGE_KEYS.DARK_MODE, !current);
                    renderApp();
                };
            }

            const toggleModeBtn = document.getElementById('toggleModeBtn');
            if (toggleModeBtn) {
                toggleModeBtn.onclick = () => {
                    state.isSignupMode = !state.isSignupMode;
                    renderApp();
                };
            }

            const authForm = document.getElementById('authForm');
            if (authForm) {
                authForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const loginId = document.getElementById('loginIdInput').value.trim();
                    const password = document.getElementById('passwordInput').value;
                    const email = `${loginId}@shinagawa.org`;

                    try {
                        if (state.isSignupMode) {
                            const displayName = document.getElementById('displayNameInput').value.trim();
                            const cred = await auth.createUserWithEmailAndPassword(email, password);
                            await db.collection('users').doc(cred.user.uid).set({
                                uid: cred.user.uid,
                                loginId: loginId,
                                name: displayName,
                                friends: [],
                                avatar: null
                            });
                        } else {
                            await auth.signInWithEmailAndPassword(email, password);
                        }
                    } catch (err) {
                        alert('認証エラー: ' + err.message);
                    }
                };
            }

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.onclick = () => auth.signOut();
            }

            const goToSettingsBtn = document.getElementById('goToSettingsBtn');
            if (goToSettingsBtn) {
                goToSettingsBtn.onclick = () => {
                    state.view = 'settings';
                    state.tempAvatar = null;
                    renderApp();
                };
            }

            const backToHomeFromSettingsBtn = document.getElementById('backToHomeFromSettingsBtn');
            if (backToHomeFromSettingsBtn) {
                backToHomeFromSettingsBtn.onclick = () => {
                    state.view = 'home';
                    state.tempAvatar = null;
                    renderApp();
                };
            }

            const backToHomeFromDetailsBtn = document.getElementById('backToHomeFromDetailsBtn');
            if (backToHomeFromDetailsBtn) {
                backToHomeFromDetailsBtn.onclick = () => {
                    state.view = 'home';
                    renderApp();
                };
            }

            const goToDetailsBtn = document.getElementById('goToDetailsBtn');
            if (goToDetailsBtn) {
                goToDetailsBtn.onclick = () => {
                    state.view = 'details';
                    renderApp();
                    fetchAllDMsForDetails();
                };
            }

            // 新規グループ作成アバター
            const triggerGroupAvatarBtn = document.getElementById('triggerGroupAvatarBtn');
            const groupAvatarFileInput = document.getElementById('groupAvatarFileInput');
            if (triggerGroupAvatarBtn && groupAvatarFileInput) {
                triggerGroupAvatarBtn.onclick = () => groupAvatarFileInput.click();
                groupAvatarFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        state.tempGroupAvatar = await resizeImage(file, 150, 150, 0.8);
                        renderApp();
                    }
                };
            }

            // グループ作成モーダル開閉
            const openCreateGroupBtn = document.getElementById('openCreateGroupBtn');
            if (openCreateGroupBtn) {
                openCreateGroupBtn.onclick = () => {
                    state.isGroupModalOpen = true;
                    state.tempGroupAvatar = null;
                    renderApp();
                };
            }

            const closeGroupModalBtn = document.getElementById('closeGroupModalBtn');
            if (closeGroupModalBtn) {
                closeGroupModalBtn.onclick = () => {
                    state.isGroupModalOpen = false;
                    state.tempGroupAvatar = null;
                    renderApp();
                };
            }

            // グループ編集モーダル開閉
            const openGroupEditBtn = document.getElementById('openGroupEditBtn');
            if (openGroupEditBtn) {
                openGroupEditBtn.onclick = () => {
                    state.isGroupEditModalOpen = true;
                    state.tempGroupAvatar = null;
                    renderApp();
                };
            }

            const closeGroupEditModalBtn = document.getElementById('closeGroupEditModalBtn');
            if (closeGroupEditModalBtn) {
                closeGroupEditModalBtn.onclick = () => {
                    state.isGroupEditModalOpen = false;
                    state.tempGroupAvatar = null;
                    renderApp();
                };
            }

            // グループ編集アバター
            const triggerGroupEditAvatarBtn = document.getElementById('triggerGroupEditAvatarBtn');
            const groupEditAvatarFileInput = document.getElementById('groupEditAvatarFileInput');
            if (triggerGroupEditAvatarBtn && groupEditAvatarFileInput) {
                triggerGroupEditAvatarBtn.onclick = () => groupEditAvatarFileInput.click();
                groupEditAvatarFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        state.tempGroupAvatar = await resizeImage(file, 150, 150, 0.8);
                        renderApp();
                    }
                };
            }

            // グループ編集フォーム送信（メンバー追加・削除・名前変更・アバター変更）
            const editGroupForm = document.getElementById('editGroupForm');
            if (editGroupForm) {
                editGroupForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const newName = document.getElementById('editGroupNameInput').value.trim();
                    const checkboxes = document.querySelectorAll('input[name="editGroupMembers"]:checked');
                    const updatedMembers = Array.from(checkboxes).map(cb => cb.value);

                    if (updatedMembers.length < 1) {
                        alert('メンバーは少なくとも1名必要です。');
                        return;
                    }

                    const updatePayload = {
                        name: newName,
                        members: updatedMembers
                    };

                    if (state.tempGroupAvatar !== null) {
                        updatePayload.avatar = state.tempGroupAvatar;
                    }

                    try {
                        await db.collection('dms').doc(state.activeRoomId).update(updatePayload);
                        state.isGroupEditModalOpen = false;
                        state.tempGroupAvatar = null;
                        alert('グループ設定を更新しました！');
                        await fetchDMsOnce();
                        renderApp();
                    } catch (err) {
                        alert('更新エラー: ' + err.message);
                    }
                };
            }

            // 新規グループ作成フォーム送信
            const createGroupForm = document.getElementById('createGroupForm');
            if (createGroupForm) {
                createGroupForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('groupNameInput').value.trim();
                    const checkboxes = document.querySelectorAll('input[name="groupMembers"]:checked');
                    const selectedMembers = Array.from(checkboxes).map(cb => cb.value);

                    if (!name) {
                        alert('グループ名を入力してください。');
                        return;
                    }

                    const myId = state.currentUserData.loginId;
                    const members = Array.from(new Set([myId, ...selectedMembers]));

                    if (members.length < 2) {
                        alert('自分以外のメンバーを少なくとも1名選んでください。');
                        return;
                    }

                    try {
                        const newRoomRef = db.collection('dms').doc();
                        await newRoomRef.set({
                            type: 'group',
                            name: name,
                            avatar: state.tempGroupAvatar || null,
                            members: members,
                            ownerId: myId,
                            createdAt: Date.now(),
                            lastMessage: 'グループが作成されました',
                            lastMessageTime: Date.now(),
                            lastSenderId: myId,
                            unread: false
                        });

                        state.isGroupModalOpen = false;
                        state.tempGroupAvatar = null;
                        alert('グループを作成しました！');
                        await fetchDMsOnce();
                        renderApp();
                    } catch (err) {
                        alert('グループ作成エラー: ' + err.message);
                    }
                };
            }

            document.querySelectorAll('[data-tab]').forEach(btn => {
                btn.onclick = () => {
                    state.currentTab = btn.getAttribute('data-tab');
                    renderApp();
                };
            });

            const addFriendForm = document.getElementById('addFriendForm');
            if (addFriendForm) {
                addFriendForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const targetId = document.getElementById('friendIdInput').value.trim();
                    if (!targetId || targetId === state.currentUserData.loginId) {
                        alert('有効なログインIDを入力してください。');
                        return;
                    }

                    const targetUser = state.allUsers.find(u => u.loginId === targetId);
                    if (!targetUser) {
                        alert('ユーザーが見つかりませんでした。');
                        return;
                    }

                    const myFriends = state.currentUserData.friends || [];
                    if (myFriends.includes(targetId)) {
                        alert('すでにフレンドです。');
                        return;
                    }

                    try {
                        const myUid = auth.currentUser.uid;
                        const targetUid = targetUser.uid;

                        const newMyFriends = [...myFriends, targetId];
                        const targetFriends = targetUser.friends || [];
                        const newTargetFriends = [...targetFriends, state.currentUserData.loginId];

                        await db.collection('users').doc(myUid).update({ friends: newMyFriends });
                        await db.collection('users').doc(targetUid).update({ friends: newTargetFriends });

                        state.currentUserData.friends = newMyFriends;
                        targetUser.friends = newTargetFriends;

                        const roomId = getRoomId(state.currentUserData.loginId, targetId);
                        await db.collection('dms').doc(roomId).set({
                            type: 'dm',
                            members: [state.currentUserData.loginId, targetId],
                            createdAt: Date.now(),
                            lastMessage: '',
                            lastMessageTime: Date.now(),
                            lastSenderId: '',
                            unread: false
                        }, { merge: true });

                        alert('フレンドに追加しました！');
                        await fetchDMsOnce();
                        renderApp();
                    } catch (err) {
                        alert('エラー: ' + err.message);
                    }
                };
            }

            document.querySelectorAll('.start-chat-btn').forEach(btn => {
                btn.onclick = () => {
                    const targetLoginId = btn.getAttribute('data-start-chat');
                    const roomId = getRoomId(state.currentUserData.loginId, targetLoginId);
                    state.activeRoomId = roomId;
                    state.view = 'chat';
                    state.messages = [];
                    renderApp();
                };
            });

            document.querySelectorAll('#app .room-item').forEach(item => {
                item.onclick = async () => {
                    const roomId = item.getAttribute('data-room-id');
                    state.activeRoomId = roomId;
                    state.view = 'chat';
                    state.messages = [];
                    try {
                        await db.collection('dms').doc(roomId).update({ unread: false });
                    } catch(e){}
                    renderApp();
                };
            });

            const backToHomeBtn = document.getElementById('backToHomeBtn');
            if (backToHomeBtn) {
                backToHomeBtn.onclick = () => {
                    if (state.unsubscribeMessages) {
                        state.unsubscribeMessages();
                        state.unsubscribeMessages = null;
                    }
                    state.activeRoomId = null;
                    state.view = 'home';
                    fetchDMsOnce();
                    renderApp();
                };
            }

            const triggerAvatarBtn = document.getElementById('triggerAvatarBtn');
            const avatarFileInput = document.getElementById('avatarFileInput');
            if (triggerAvatarBtn && avatarFileInput) {
                triggerAvatarBtn.onclick = () => avatarFileInput.click();
                avatarFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        state.tempAvatar = await resizeImage(file, 150, 150, 0.8);
                        renderApp();
                    }
                };
            }

            const profileForm = document.getElementById('profileForm');
            if (profileForm) {
                profileForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const newName = document.getElementById('editNameInput').value.trim();
                    const updateData = { name: newName };
                    if (state.tempAvatar !== null) {
                        updateData.avatar = state.tempAvatar;
                    }

                    try {
                        await db.collection('users').doc(auth.currentUser.uid).update(updateData);
                        state.currentUserData.name = newName;
                        if (updateData.avatar) state.currentUserData.avatar = updateData.avatar;
                        state.tempAvatar = null;
                        alert('プロフィールを更新しました！');
                        state.view = 'home';
                        renderApp();
                    } catch (err) {
                        alert('エラー: ' + err.message);
                    }
                };
            }

            const triggerChatFileBtn = document.getElementById('triggerChatFileBtn');
            const chatFileInput = document.getElementById('chatFileInput');
            if (triggerChatFileBtn && chatFileInput) {
                triggerChatFileBtn.onclick = () => chatFileInput.click();
                chatFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        let fileData;
                        if (file.type.startsWith('image/')) {
                            fileData = await resizeImage(file, 800, 800, 0.7);
                        } else {
                            fileData = await new Promise((res) => {
                                const r = new FileReader();
                                r.onload = (ev) => res(ev.target.result);
                                r.readAsDataURL(file);
                            });
                        }
                        state.selectedFile = { name: file.name, type: file.type, data: fileData };
                        renderApp();
                    }
                };
            }

            const cancelFileBtn = document.getElementById('cancelFileBtn');
            if (cancelFileBtn) {
                cancelFileBtn.onclick = () => {
                    state.selectedFile = null;
                    renderApp();
                };
            }

            const messageForm = document.getElementById('messageForm');
            if (messageForm) {
                messageForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const input = document.getElementById('messageInput');
                    const text = input.value.trim();
                    if (!text && !state.selectedFile) return;

                    const nowTimestamp = Date.now();
                    const msgData = {
                        senderId: state.currentUserData.loginId,
                        senderName: state.currentUserData.name,
                        text: text,
                        file: state.selectedFile,
                        createdAt: nowTimestamp,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        unsent: false
                    };

                    const roomId = state.activeRoomId;
                    input.value = '';
                    state.selectedFile = null;

                    try {
                        await db.collection('messages').doc(roomId).collection('chats').add(msgData);
                        await db.collection('dms').doc(roomId).set({
                            lastMessage: text || '[ファイル]',
                            lastMessageTime: nowTimestamp,
                            lastSenderId: state.currentUserData.loginId,
                            unread: true
                        }, { merge: true });
                    } catch (err) {
                        alert('送信エラー: ' + err.message);
                    }
                };
            }

            attachUnsendEvents();
        }

        // 初期描画実行
        renderApp();
    </script>
</body>
</html>
