<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach</title>
    <!-- ファビコン・ホーム画面用アイコン -->
    <link rel="icon" type="image/png" href="./Reach.png">
    <link rel="apple-touch-icon" href="./Reach.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen flex flex-col text-slate-800 dark:text-slate-100 transition-colors">

    <!-- App Root Container -->
    <div id="app" class="flex-1 flex flex-col min-h-screen w-full"></div>

    <script>
        // --- 1. Firebase設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyA6Dbr9A6AUexhH-iCUr3lyiXx-2I5vpY8",
            authDomain: "chats-36528.firebaseapp.com",
            projectId: "chats-36528",
            storageBucket: "chats-36528.firebasestorage.app",
            messagingSenderId: "971663710322",
            appId: "1:971663710322:web:ebab63bd30840517a6caeb"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- 2. アプリケーション状態 ---
        const state = {
            isSignupMode: false,
            currentTab: 'chats',
            view: 'home',
            activeRoomId: null,
            selectedFile: null,
            replyToMessage: null,
            tempAvatar: null,
            tempGroupAvatar: null,
            currentUserData: null,
            allUsers: [],
            dms: [],
            messages: [],
            unsubscribeMessages: null,
            isGroupModalOpen: false,
            isGroupEditModalOpen: false,
            isLoadingMore: false,
            hasMoreMessages: true,
            // 未読プレビュー用状態
            isPeekModalOpen: false,
            peekRoomId: null,
            peekRoomName: ''
        };

        const STORAGE_KEYS = { DARK_MODE: 'reach_dark_mode_v21' };
        function isDarkMode() { return localStorage.getItem(STORAGE_KEYS.DARK_MODE) === 'true'; }

        // --- 日付フォーマット用ヘルパー ---
        function formatDateLabel(timestamp) {
            if (!timestamp) return '';
            const msgDate = new Date(timestamp);
            const now = new Date();
            
            const msgDateStr = msgDate.toDateString();
            const nowStr = now.toDateString();
            
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            const yesterdayStr = yesterday.toDateString();

            if (msgDateStr === nowStr) return '今日';
            if (msgDateStr === yesterdayStr) return '昨日';

            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const year = msgDate.getFullYear();
            const month = msgDate.getMonth() + 1;
            const date = msgDate.getDate();
            const dayName = days[msgDate.getDay()];

            if (year === now.getFullYear()) {
                return `${month}月${date}日 (${dayName})`;
            }
            return `${year}年${month}月${date}日 (${dayName})`;
        }

        // --- 3. 画像リサイズ・アバター描画 ---
        function resizeImage(file, maxWidth = 120, maxHeight = 120, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        function renderAvatar(userOrGroup, sizeClass = 'w-10 h-10', textClass = 'text-sm') {
            if (userOrGroup && userOrGroup.avatar) {
                return `<img src="${userOrGroup.avatar}" alt="${escapeHtml(userOrGroup.name)}" class="${sizeClass} rounded-full object-cover shadow-sm border border-slate-200 dark:border-slate-700">`;
            }
            if (userOrGroup && userOrGroup.type === 'group') {
                return `<div class="${sizeClass} rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold shadow-sm ${textClass}">👥</div>`;
            }
            const initial = userOrGroup && userOrGroup.name ? userOrGroup.name.charAt(0) : '?';
            return `<div class="${sizeClass} rounded-full bg-blue-500 text-white flex items-center justify-center font-bold shadow-sm ${textClass}">${initial}</div>`;
        }

        function getRoomId(id1, id2) {
            return [id1, id2].sort().join('_vs_');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>"]/g, (match) => {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                }[match];
            });
        }

       // --- 4. Firebase認証・データ取得 ---
auth.onAuthStateChanged(async (user) => {
    if (user) {
        try {
            // 1. まず現在のログインUID（auth.currentUser.uid）のドキュメントを直接取得してみる
            let userDocRef = db.collection('users').doc(user.uid);
            let doc = await userDocRef.get();

            // 2. なければ auth_uid フィールドで検索
            if (!doc.exists) {
                const snap = await db.collection('users').where('auth_uid', '==', user.uid).limit(1).get();
                if (!snap.empty) {
                    doc = snap.docs[0];
                    userDocRef = doc.ref;
                }
            }

            // 3. それでも存在しない場合は、現在のUIDをドキュメントIDとして新規自動作成する
            if (!doc.exists) {
                const defaultUserData = {
                    auth_uid: user.uid,
                    loginId: user.email ? user.email.split('@')[0] : 'user_' + user.uid.slice(0, 5),
                    name: '山田 太郎',
                    realName: '',
                    friends: [],
                    avatar: null,
                    createdAt: Date.now()
                };
                await userDocRef.set(defaultUserData);
                state.currentUserData = { id: user.uid, ...defaultUserData };
            } else {
                state.currentUserData = { id: userDocRef.id, ...doc.data() };
            }

            await fetchAllUsers();
            await fetchDMsOnce();
        } catch (err) {
            console.error("データ取得エラー:", err);
        }
    } else {
        state.currentUserData = null;
        if (state.unsubscribeMessages) state.unsubscribeMessages();
    }
    renderApp();
});

        async function fetchAllUsers() {
            try {
                const snapshot = await db.collection('users').get();
                state.allUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (err) {
                console.error("ユーザー一覧取得エラー:", err);
            }
        }

        async function fetchDMsOnce() {
            if (!state.currentUserData) return;
            try {
                const snapshot = await db.collection('dms')
                  .where('members', 'array-contains', state.currentUserData.loginId)
                  .get();
                
                let fetchedDms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const friends = state.currentUserData.friends || [];
                friends.forEach(friendId => {
                    const roomId = getRoomId(state.currentUserData.loginId, friendId);
                    const exists = fetchedDms.some(d => d.id === roomId);
                    if (!exists) {
                        fetchedDms.push({
                            id: roomId,
                            type: 'dm',
                            members: [state.currentUserData.loginId, friendId],
                            lastMessage: 'タップしてチャットを始めましょう',
                            lastMessageTime: 0,
                            lastSenderId: '',
                            unread: false,
                            isPinned: false
                        });
                    }
                });

                // ★ 変更点③: ピン留め（isPinned）優先 ＋ メッセージ日時順ソート
                fetchedDms.sort((a, b) => {
                    if (a.isPinned && !b.isPinned) return -1;
                    if (!a.isPinned && b.isPinned) return 1;
                    return (b.lastMessageTime || 0) - (a.lastMessageTime || 0);
                });

                state.dms = fetchedDms.slice(0, 10);
                state.allDmsCount = fetchedDms.length;
            } catch (err) {
                console.error("DM一覧取得エラー:", err);
            }
        }

        // リアルタイムメッセージ受信
        function subscribeMessages(roomId) {
            if (state.unsubscribeMessages) state.unsubscribeMessages();
            state.hasMoreMessages = true;
            state.isLoadingMore = false;

            state.unsubscribeMessages = db.collection('messages').doc(roomId).collection('chats')
                .orderBy('createdAt', 'desc')
                .limit(50)
                .onSnapshot(async (snapshot) => {
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    if (state.messages.length > 50) {
                        const newLatestDocs = docs.reverse();
                        const existingOldDocs = state.messages.slice(0, state.messages.length - 50);
                        const docMap = new Map();
                        [...existingOldDocs, ...newLatestDocs].forEach(m => docMap.set(m.id, m));
                        state.messages = Array.from(docMap.values()).sort((a, b) => a.createdAt - b.createdAt);
                    } else {
                        state.messages = docs.reverse();
                    }

                    if (state.view === 'chat' && state.currentUserData) {
                        const myLoginId = state.currentUserData.loginId;
                        state.messages.forEach(async (m) => {
                            if (m.senderId !== myLoginId) {
                                const readUsers = m.readUsers || [];
                                if (!readUsers.includes(myLoginId)) {
                                    try {
                                        await db.collection('messages').doc(roomId).collection('chats').doc(m.id).update({
                                            readUsers: firebase.firestore.FieldValue.arrayUnion(myLoginId)
                                        });
                                    } catch (e) {
                                        console.error("既読追加エラー:", e);
                                    }
                                }
                            }
                        });
                    }
                    
                    if (state.view === 'chat') {
                        updateChatMessagesOnly();
                    } else {
                        renderApp();
                    }
                });
        }

        async function loadMoreMessages() {
            if (state.isLoadingMore || !state.hasMoreMessages || state.messages.length === 0) return;
            
            state.isLoadingMore = true;
            const container = document.getElementById('messageContainer');
            const oldScrollHeight = container ? container.scrollHeight : 0;

            const oldestMsg = state.messages[0];
            try {
                const snapshot = await db.collection('messages').doc(state.activeRoomId).collection('chats')
                    .orderBy('createdAt', 'desc')
                    .where('createdAt', '<', oldestMsg.createdAt)
                    .limit(20)
                    .get();

                if (snapshot.empty) {
                    state.hasMoreMessages = false;
                } else {
                    const olderDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).reverse();
                    state.messages = [...olderDocs, ...state.messages];
                    updateChatMessagesOnly();

                    if (container) {
                        const newScrollHeight = container.scrollHeight;
                        container.scrollTop = newScrollHeight - oldScrollHeight;
                    }
                }
            } catch (err) {
                console.error("過去ログ取得エラー:", err);
            } finally {
                state.isLoadingMore = false;
            }
        }

        function updateChatMessagesOnly() {
            const container = document.getElementById('messageContainer');
            if (!container) return;

            const currentUser = state.currentUserData;
            const activeRoom = state.dms.find(r => r.id === state.activeRoomId) || { members: [] };
            const totalPartners = Math.max(1, (activeRoom.members || []).length - 1);
            const totalMessages = state.messages.length;

            const loadingHeader = state.hasMoreMessages ? `
                <div class="text-center py-2 text-xs text-slate-400 font-semibold flex items-center justify-center space-x-1">
                    <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                    <span>上にスクロールして過去ログを取得</span>
                </div>
            ` : `
                <div class="text-center py-2 text-[11px] text-slate-400">これが最古のメッセージです</div>
            `;

            let lastDateLabel = '';
            let messagesHtml = '';

            state.messages.forEach((m) => {
                const dateLabel = formatDateLabel(m.createdAt);
                
                if (dateLabel && dateLabel !== lastDateLabel) {
                    messagesHtml += `
                        <div class="flex items-center justify-center my-4">
                            <div class="px-3 py-1 rounded-full text-[11px] font-bold bg-slate-200/80 dark:bg-slate-800 text-slate-500 dark:text-slate-400 shadow-sm border border-slate-300/40 dark:border-slate-700/50 select-none">
                                ${escapeHtml(dateLabel)}
                            </div>
                        </div>
                    `;
                    lastDateLabel = dateLabel;
                }

                const isSelf = m.senderId === currentUser.loginId;
                const readUsers = m.readUsers || [];
                const readCount = readUsers.length;

                if (m.isSystem) {
                    messagesHtml += `
                        <div class="flex justify-center my-2">
                            <div class="px-3 py-1 rounded-xl text-xs bg-slate-200/60 dark:bg-slate-800 text-slate-400 italic shadow-sm">
                                ${escapeHtml(m.text)}
                            </div>
                        </div>
                    `;
                    return;
                }

                let readLabelHtml = '';
                if (isSelf) {
                    if (readCount >= totalPartners) {
                        readLabelHtml = '<span class="text-[10px] font-semibold text-blue-500 dark:text-blue-400">既読</span>';
                    } else if (readCount > 0) {
                        readLabelHtml = `<span class="text-[10px] font-semibold text-blue-500 dark:text-blue-400">既読 ${readCount}</span>`;
                    } else {
                        readLabelHtml = '<span class="text-[10px] text-slate-400">未読</span>';
                    }
                }

                if (m.unsent) {
                    messagesHtml += `
                        <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'} my-2">
                            <div class="px-4 py-2 rounded-xl text-xs bg-slate-200/60 dark:bg-slate-800 text-slate-400 italic">
                                メッセージの送信を取り消しました
                            </div>
                        </div>
                    `;
                    return;
                }

                const replyHtml = m.replyTo ? `
                    <div class="mb-1.5 p-1.5 rounded-lg bg-black/10 dark:bg-white/10 text-xs border-l-2 border-blue-400 dark:border-blue-300">
                        <div class="font-bold text-[11px] opacity-80">${escapeHtml(m.replyTo.name)}</div>
                        <div class="truncate text-[11px] opacity-70">${escapeHtml(m.replyTo.text || '[ファイル]')}</div>
                    </div>
                ` : '';

                messagesHtml += `
                    <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'} group my-2">
                        <span class="text-xs text-slate-400 mb-1 px-1">${escapeHtml(m.senderName)}</span>
                        <div class="flex items-end space-x-2 max-w-[85%] ${isSelf ? 'flex-row-reverse space-x-reverse' : ''}">
                            <div class="px-4 py-2.5 rounded-2xl text-sm shadow-sm ${isSelf ? 'bg-blue-500 text-white rounded-br-none' : 'bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-bl-none border border-slate-100 dark:border-slate-800'}">
                                ${replyHtml}
                                ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ''}
                                ${m.file ? renderFileContent(m.file) : ''}
                            </div>
                            <div class="flex flex-col items-end text-[10px] text-slate-400 flex-shrink-0 space-y-0.5">
                                <span>${escapeHtml(m.time)}</span>
                                ${readLabelHtml}
                            </div>
                            <div class="opacity-65 group-hover:opacity-100 transition-opacity flex items-center space-x-1 px-1 select-none">
                                <button data-reply-id="${escapeHtml(m.id)}" class="reply-btn text-[11px] text-slate-400 hover:text-blue-500 p-1" title="返信">
                                    <i data-lucide="reply" class="w-3.5 h-3.5"></i>
                                </button>
                                <button data-pin-text="${escapeHtml(m.text || '[ファイル]')}" data-pin-name="${escapeHtml(m.senderName)}" class="pin-btn text-[11px] text-slate-400 hover:text-amber-500 p-1" title="ピン留め">
                                    <i data-lucide="pin" class="w-3.5 h-3.5"></i>
                                </button>
                                ${isSelf ? `
                                    <button data-unsend-id="${escapeHtml(m.id)}" class="unsend-btn text-[11px] text-slate-400 hover:text-red-400 p-1" title="送信取り消し">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = loadingHeader + (totalMessages === 0 
                ? '<div class="text-center text-xs text-slate-400 py-10">メッセージやファイルを送信してみましょう！</div>' 
                : messagesHtml);

            if (!container.dataset.initialized) {
                container.scrollTop = container.scrollHeight;
                container.dataset.initialized = 'true';
            }

            container.onscroll = () => {
                if (container.scrollTop === 0) {
                    loadMoreMessages();
                }
            };

            lucide.createIcons();
            attachMessageActionEvents();
        }

        // --- 5. 描画ルーター ---
        window.renderApp = function() {
            if (isDarkMode()) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            const root = document.getElementById('app');
            if (!state.currentUserData) {
                root.innerHTML = renderAuthScreen();
            } else if (state.view === 'home') {
                root.innerHTML = renderHomeScreen(state.currentUserData);
            } else if (state.view === 'chat') {
                root.innerHTML = renderChatScreen(state.currentUserData);
            } else if (state.view === 'settings') {
                root.innerHTML = renderSettingsScreen(state.currentUserData);
            } else if (state.view === 'details') {
                root.innerHTML = renderDetailsScreen(state.currentUserData);
            }

            lucide.createIcons();
            attachEvents();
        };

        function renderDarkModeButton() {
            const dark = isDarkMode();
            return `
                <button id="globalDarkModeToggleBtn" class="text-slate-500 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition" title="ダークモード切替">
                    ${dark ? '<i data-lucide="sun" class="w-5 h-5"></i>' : '<i data-lucide="moon" class="w-5 h-5"></i>'}
                </button>
            `;
        }

        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 dark:from-blue-950 dark:to-slate-900 p-4 relative overflow-y-auto">
                    <div class="absolute top-4 right-4">${renderDarkModeButton()}</div>
                    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-md p-8 flex flex-col space-y-6 border border-slate-100 dark:border-slate-800 my-auto">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 mx-auto flex items-center justify-center shadow-lg shadow-blue-500/30 overflow-hidden rounded-2xl">
                                <img src="./Reach.png" alt="Reach Logo" class="w-full h-full object-cover">
                            </div>
                            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Reach</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400">${state.isSignupMode ? '新規アカウント登録' : 'ログイン'}</p>
                        </div>
                        <form id="authForm" class="space-y-4">
                            ${state.isSignupMode ? `
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">表示名 (アプリ内用)</label>
                                    <input type="text" id="displayNameInput" required placeholder="例: 山田 太郎" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div class="bg-blue-50/50 dark:bg-slate-800/40 p-3.5 rounded-xl border border-blue-100 dark:border-slate-700 space-y-3">
                                    <div class="text-xs font-bold text-blue-600 dark:text-blue-400 flex items-center space-x-1">
                                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                                        <span>管理者確認用情報 (非公開)</span>
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">本名 (管理者確認用)</label>
                                        <input type="text" id="realNameInput" required placeholder="例: 山田 太郎" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </div>
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">ログインID</label>
                                <input type="text" id="loginIdInput" required placeholder="例: abc123" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">パスワード (6文字以上)</label>
                                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 transition">
                                ${state.isSignupMode ? '登録してログイン' : 'ログイン'}
                            </button>
                        </form>
                        <div class="text-center">
                            <button id="toggleModeBtn" class="text-xs text-blue-600 dark:text-blue-400 hover:underline font-medium">
                                ${state.isSignupMode ? 'すでにアカウントをお持ちですか？ ログインへ' : 'アカウントをお持ちでない場合は新規登録'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHomeScreen(currentUser) {
            const friendUsers = state.allUsers.filter(u => (currentUser.friends || []).includes(u.loginId));

            return `
                <div class="flex-1 flex flex-col h-full bg-white dark:bg-slate-900 max-w-xl mx-auto w-full shadow-lg border-x border-slate-200 dark:border-slate-800 relative">
                    <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                        <div class="flex items-center space-x-3">

                <div class="absolute inset-0 bg-black/50 flex items-center justify-center p-4 z-50">

        function renderDetailsScreen(currentUser) {

                    </div>
                </div>
            `;

        async function fetchAllDMsForDetails() {
            if (!state.currentUserData) return;
            try {
                const snapshot = await db.collection('dms')
                  .where('members', 'array-contains', state.currentUserData.loginId)
                  .get();
                let allDms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const friends = state.currentUserData.friends || [];
                friends.forEach(friendId => {
                    const roomId = getRoomId(state.currentUserData.loginId, friendId);
                    if (!allDms.some(d => d.id === roomId)) {
                        allDms.push({
                            id: roomId,
                            type: 'dm',
                            members: [state.currentUserData.loginId, friendId],
                            lastMessage: 'タップしてチャットを始めましょう',
                            lastMessageTime: 0,
                            lastSenderId: '',
                            unread: false
                        });
                    }
                });

                allDms.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
                
                const container = document.getElementById('detailsListContainer');
                if (!container) return;

                if (allDms.length === 0) {
                    container.innerHTML = '<div class="text-center text-xs text-slate-400 py-12">トーク履歴がありません</div>';
                    return;
                }

                container.innerHTML = allDms.map(room => {
                    const isGroup = room.type === 'group';
                    let displayName = room.name || 'グループチャット';
                    let displayUserOrGroup = room;

                    if (!isGroup) {
                        const partnerId = room.members.find(id => id !== state.currentUserData.loginId);
                        displayUserOrGroup = state.allUsers.find(u => u.loginId === partnerId) || { name: partnerId, avatar: null };
                        displayName = displayUserOrGroup.name;
                    }

                    const isUnread = room.lastSenderId && room.lastSenderId !== state.currentUserData.loginId && room.unread === true;

                    return `
                        <div data-room-id="${room.id}" class="room-item flex items-center justify-between p-3.5 rounded-2xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60 border border-slate-100 dark:border-slate-800 transition shadow-sm">
                            <div class="flex items-center space-x-3.5 min-w-0 flex-1">
                                ${renderAvatar(displayUserOrGroup, 'w-12 h-12', 'text-lg')}
                                <div class="flex-1 min-w-0 pr-2">
                                    <div class="flex items-center justify-between">
                                        <div class="font-bold text-slate-800 dark:text-slate-100 text-sm truncate">${escapeHtml(displayName)} ${isGroup ? `<span class="text-xs font-normal text-slate-400">(${room.members.length})</span>` : ''}</div>
                                        ${isUnread ? '<span class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">新着</span>' : ''}
                                    </div>
                                    <div class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(room.lastMessage || 'タップしてチャットを開く')}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('.room-item').forEach(item => {
                    item.onclick = async () => {
                        const roomId = item.getAttribute('data-room-id');
                        state.activeRoomId = roomId;
                        state.view = 'chat';
                        state.messages = [];
                        try {
                            await db.collection('dms').doc(roomId).update({ unread: false });
                        } catch(e){}
                        renderApp();
                    };
                });
                lucide.createIcons();
            } catch (err) {
                console.error("Details取得エラー:", err);
            }
        }

                return `<div class="mt-1"><img src="${file.data}" alt="${escapeHtml(file.name)}" class="max-w-xs rounded-xl max-h-48 object-cover cursor-pointer shadow-sm"></div>`;
            }
            return `
                <div class="mt-1 flex items-center space-x-2 bg-black/10 dark:bg-white/10 p-2 rounded-xl text-xs">
                    <i data-lucide="file" class="w-4 h-4 flex-shrink-0"></i>
                    <a href="${file.data}" download="${escapeHtml(file.name)}" class="underline truncate font-medium hover:opacity-80">${escapeHtml(file.name)}</a>
                </div>
            `;
        }

        function renderChatScreen(currentUser) {
            const activeRoom = state.dms.find(r => r.id === state.activeRoomId) || { members: [], type: 'dm' };
            const isGroup = activeRoom.type === 'group';

            let titleName = '不明';
            let subtitleText = '';
            let headerAvatarObj = activeRoom;

            if (isGroup) {
                titleName = activeRoom.name || 'グループチャット';
                subtitleText = `${activeRoom.members.length} 人のメンバー`;
            } else {
                const partnerLoginId = activeRoom.members.find(id => id !== currentUser.loginId);
                const activePartner = state.allUsers.find(u => u.loginId === partnerLoginId) || { name: '不明', loginId: '', avatar: null };
                titleName = activePartner.name;
                subtitleText = `ID: ${activePartner.loginId}`;
                headerAvatarObj = activePartner;
            }

            setTimeout(() => {
                if (state.activeRoomId) {
                    subscribeMessages(state.activeRoomId);
                }
            }, 0);

            const pinned = activeRoom.pinnedMessage;

            return `
                <div class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-950 max-w-xl mx-auto w-full shadow-lg border-x border-slate-200 dark:border-slate-800 relative">
                    <div class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between shadow-sm flex-shrink-0">
                        <div class="flex items-center space-x-3">
                            <button id="backToHomeBtn" class="p-2 -ml-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition flex items-center space-x-1">
                                <i data-lucide="chevron-left" class="w-6 h-6"></i>
                                <span class="text-sm font-semibold">戻る</span>
                            </button>
                            <div class="flex items-center space-x-2">
                                ${renderAvatar(headerAvatarObj, 'w-9 h-9', 'text-sm')}
                                <div>
                                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm">${escapeHtml(titleName)}</h3>
                                    <p class="text-[10px] text-slate-400">${escapeHtml(subtitleText)}</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            ${isGroup ? `
                                <button id="openGroupEditBtn" class="p-2 text-slate-400 hover:text-indigo-500 rounded-lg transition" title="グループ設定">
                                    <i data-lucide="settings" class="w-5 h-5"></i>
                                </button>
                            ` : ''}
                            ${renderDarkModeButton()}
                        </div>
                    </div>

                    <!-- ピン留めエリア -->
                    ${pinned ? `
                        <div class="bg-amber-50 dark:bg-amber-950/40 border-b border-amber-200 dark:border-amber-900 px-4 py-2 flex items-center justify-between text-xs text-amber-900 dark:amber-200 shadow-sm flex-shrink-0">
                            <div class="flex items-center space-x-2 truncate min-w-0 flex-1 pr-2">
                                <i data-lucide="pin" class="w-4 h-4 text-amber-500 flex-shrink-0"></i>
                                <span class="font-bold flex-shrink-0">${escapeHtml(pinned.name)}:</span>
                                <span class="truncate">${escapeHtml(pinned.text)}</span>
                            </div>
                            <button id="unpinBtn" class="text-amber-500 hover:text-amber-700 p-1 flex-shrink-0" title="ピン留め解除">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    ` : ''}

                    <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-2">
                        <div class="text-center py-2 text-xs text-slate-400 font-semibold flex items-center justify-center space-x-1">
                            <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                            <span>上にスクロールして過去ログを取得</span>
                        </div>
                        <div class="text-center text-xs text-slate-400 py-10">読み込み中...</div>
                    </div>

                    <!-- 添付ファイルプレビュー -->
                    ${state.selectedFile ? `
                        <div class="bg-blue-50 dark:bg-blue-950/60 border-t border-blue-200 dark:border-blue-800 px-4 py-2 flex items-center justify-between text-xs text-blue-800 dark:text-blue-300">
                            <div class="flex items-center space-x-2 truncate">
                                <i data-lucide="paperclip" class="w-4 h-4 flex-shrink-0"></i>
                                <span class="font-bold truncate">${escapeHtml(state.selectedFile.name)}</span>
                            </div>
                            <button id="cancelFileBtn" class="text-slate-400 hover:text-red-500 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                    ` : ''}

                    <!-- 引用返信プレビュー -->
                    ${state.replyToMessage ? `
                        <div class="bg-indigo-50 dark:bg-indigo-950/60 border-t border-indigo-200 dark:border-indigo-800 px-4 py-2 flex items-center justify-between text-xs text-indigo-900 dark:text-indigo-200">
                            <div class="flex items-center space-x-2 truncate">
                                <i data-lucide="reply" class="w-4 h-4 flex-shrink-0 text-indigo-500"></i>
                                <span class="font-bold flex-shrink-0">${escapeHtml(state.replyToMessage.name)}:</span>
                                <span class="truncate">${escapeHtml(state.replyToMessage.text)}</span>
                            </div>
                            <button id="cancelReplyBtn" class="text-slate-400 hover:text-red-500 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                    ` : ''}

                    <div class="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center space-x-2">
                        <input type="file" id="chatFileInput" class="hidden">
                        <button id="triggerChatFileBtn" class="p-2.5 text-slate-400 hover:text-blue-500 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="ファイルを添付">
                            <i data-lucide="paperclip" class="w-5 h-5"></i>
                        </button>
                        <form id="messageForm" class="flex-1 flex space-x-2">
                            <input type="text" id="messageInput" placeholder="メッセージを入力..." class="flex-1 px-4 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 border border-transparent dark:border-slate-700">
                            <button type="submit" class="px-4 py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-xl shadow-sm transition flex items-center justify-center">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>

                    ${renderGroupEditModal()}
                </div>
            `;
        }

        function attachMessageActionEvents() {
            document.querySelectorAll('.unsend-btn').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const msgId = btn.getAttribute('data-unsend-id');
                    if (confirm('このメッセージを取り消しますか？')) {
                        try {
                            await db.collection('messages').doc(state.activeRoomId).collection('chats').doc(msgId).update({
                                unsent: true,
                                text: '',
                                file: null
                            });
                        } catch (err) {
                            alert('エラー: ' + err.message);
                        }
                    }
                };
            });

            document.querySelectorAll('.reply-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const msgId = btn.getAttribute('data-reply-id');
                    const targetMsg = state.messages.find(m => m.id === msgId);
                    if (targetMsg) {
                        state.replyToMessage = {
                            id: targetMsg.id,
                            name: targetMsg.senderName,
                            text: targetMsg.text || '[ファイル]'
                        };
                        renderApp();
                    }
                };
            });

            document.querySelectorAll('.pin-btn').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const name = btn.getAttribute('data-pin-name');
                    const text = btn.getAttribute('data-pin-text');
                    try {
                        await db.collection('dms').doc(state.activeRoomId).update({
                            pinnedMessage: { name, text }
                        });
                        await fetchDMsOnce();
                        renderApp();
                    } catch (err) {
                        alert('ピン留めエラー: ' + err.message);
                    }
                };
            });
        }

        // --- 6. イベントハンドラ ---
        function attachEvents() {
            const globalDarkBtn = document.getElementById('globalDarkModeToggleBtn');
            if (globalDarkBtn) {
                globalDarkBtn.onclick = () => {
                    const current = isDarkMode();
                    localStorage.setItem(STORAGE_KEYS.DARK_MODE, !current);
                    renderApp();
                };
            }

            const toggleModeBtn = document.getElementById('toggleModeBtn');
            if (toggleModeBtn) {
                toggleModeBtn.onclick = () => {
                    state.isSignupMode = !state.isSignupMode;
                    renderApp();
                };
            }

            const authForm = document.getElementById('authForm');
            if (authForm) {
                authForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const loginId = document.getElementById('loginIdInput').value.trim();
                    const password = document.getElementById('passwordInput').value;
                    const email = `${loginId}@shinagawa.org`;

                    try {
                        if (state.isSignupMode) {
                            const displayName = document.getElementById('displayNameInput').value.trim();
                            const realName = document.getElementById('realNameInput').value.trim();
                            
                            const cred = await auth.createUserWithEmailAndPassword(email, password);
                            const authUid = cred.user.uid;

                            const userData = {
                                auth_uid: authUid,
                                loginId: loginId,
                                name: displayName,
                                realName: realName,
                                friends: [],
                                avatar: null,
                                createdAt: Date.now()
                            };

                            await db.collection('users').doc(authUid).set(userData);
                            state.currentUserData = { id: authUid, ...userData };

                        } else {
                            await auth.signInWithEmailAndPassword(email, password);
                        }
                    } catch (err) {
                        console.error("認証・登録エラー:", err);
                        alert('認証エラー: ' + err.message);
                    }
                };
            }

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.onclick = () => auth.signOut();
            }

            const goToSettingsBtn = document.getElementById('goToSettingsBtn');
            if (goToSettingsBtn) {
                goToSettingsBtn.onclick = () => {
                    state.view = 'settings';
                    state.tempAvatar = null;
                    renderApp();
                };
            }

            const backToHomeFromSettingsBtn = document.getElementById('backToHomeFromSettingsBtn');
            if (backToHomeFromSettingsBtn) {
                backToHomeFromSettingsBtn.onclick = () => {
                    state.view = 'home';
                    state.tempAvatar = null;
                    renderApp();
                };
            }

            const backToHomeFromDetailsBtn = document.getElementById('backToHomeFromDetailsBtn');
            if (backToHomeFromDetailsBtn) {
                backToHomeFromDetailsBtn.onclick = () => {
                    state.view = 'home';
                    renderApp();
                };
            }

            const goToDetailsBtn = document.getElementById('goToDetailsBtn');
            if (goToDetailsBtn) {
                goToDetailsBtn.onclick = () => {
                    state.view = 'details';
                    renderApp();
                    fetchAllDMsForDetails();
                };
            }

            const unpinBtn = document.getElementById('unpinBtn');
            if (unpinBtn) {
                unpinBtn.onclick = async () => {
                    try {
                        await db.collection('dms').doc(state.activeRoomId).update({
                            pinnedMessage: firebase.firestore.FieldValue.delete()
                        });
                        await fetchDMsOnce();
                        renderApp();
                    } catch (err) {
                        alert('ピン留め解除エラー: ' + err.message);
                    }
                };
            }

            const triggerGroupAvatarBtn = document.getElementById('triggerGroupAvatarBtn');
            const groupAvatarFileInput = document.getElementById('groupAvatarFileInput');
            if (triggerGroupAvatarBtn && groupAvatarFileInput) {
                triggerGroupAvatarBtn.onclick = () => groupAvatarFileInput.click();
                groupAvatarFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        state.tempGroupAvatar = await resizeImage(file, 150, 150, 0.8);
                        renderApp();
                    }
                };
            }

            const openCreateGroupBtn = document.getElementById('openCreateGroupBtn');
            if (openCreateGroupBtn) {
                openCreateGroupBtn.onclick = () => {
                    state.isGroupModalOpen = true;
                    state.tempGroupAvatar = null;
                    renderApp();
                };
            }

            const closeGroupModalBtn = document.getElementById('closeGroupModalBtn');
            if (closeGroupModalBtn) {
                closeGroupModalBtn.onclick = () => {
                    state.isGroupModalOpen = false;
                    state.tempGroupAvatar = null;
                    renderApp();
                };
            }

            const openGroupEditBtn = document.getElementById('openGroupEditBtn');
            if (openGroupEditBtn) {
                openGroupEditBtn.onclick = () => {
                    state.isGroupEditModalOpen = true;
                    state.tempGroupAvatar = null;
                    renderApp();
                };
            }

            const closeGroupEditModalBtn = document.getElementById('closeGroupEditModalBtn');
            if (closeGroupEditModalBtn) {
                closeGroupEditModalBtn.onclick = () => {
                    state.isGroupEditModalOpen = false;
                    state.tempGroupAvatar = null;
                    renderApp();
                };
            }

            const triggerGroupEditAvatarBtn = document.getElementById('triggerGroupEditAvatarBtn');
            const groupEditAvatarFileInput = document.getElementById('groupEditAvatarFileInput');
            if (triggerGroupEditAvatarBtn && groupEditAvatarFileInput) {
                triggerGroupEditAvatarBtn.onclick = () => groupEditAvatarFileInput.click();
                groupEditAvatarFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        state.tempGroupAvatar = await resizeImage(file, 150, 150, 0.8);
                        renderApp();
                    }
                };
            }

            const editGroupForm = document.getElementById('editGroupForm');
            if (editGroupForm) {
                editGroupForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const newName = document.getElementById('editGroupNameInput').value.trim();
                    const checkboxes = document.querySelectorAll('input[name="editGroupMembers"]:checked');
                    const updatedMembers = Array.from(checkboxes).map(cb => cb.value);

                    if (updatedMembers.length < 1) {
                        alert('メンバーは少なくとも1名必要です。');
                        return;
                    }

                    const updatePayload = { name: newName, members: updatedMembers };
                    if (state.tempGroupAvatar !== null) {
                        updatePayload.avatar = state.tempGroupAvatar;
                    }

                    try {
                        await db.collection('dms').doc(state.activeRoomId).update(updatePayload);

                        const nowTimestamp = Date.now();
                        const systemMsg = {
                            senderId: 'system',
                            senderName: 'システム',
                            text: `${state.currentUserData.name} がグループ設定を変更しました`,
                            createdAt: nowTimestamp,
                            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                            unsent: false,
                            isSystem: true,
                            readUsers: [state.currentUserData.loginId]
                        };

                        await db.collection('messages').doc(state.activeRoomId).collection('chats').add(systemMsg);

                        await db.collection('dms').doc(state.activeRoomId).set({
                            lastMessage: `${state.currentUserData.name} がグループ設定を変更しました`,
                            lastMessageTime: nowTimestamp,
                            lastSenderId: state.currentUserData.loginId,
                            unread: true
                        }, { merge: true });

                        state.isGroupEditModalOpen = false;
                        state.tempGroupAvatar = null;
                        alert('グループ設定を更新しました！');
                        await fetchDMsOnce();
                        renderApp();
                    } catch (err) {
                        alert('更新エラー: ' + err.message);
                    }
                };
            }

            const createGroupForm = document.getElementById('createGroupForm');
            if (createGroupForm) {
                createGroupForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('groupNameInput').value.trim();
                    const checkboxes = document.querySelectorAll('input[name="groupMembers"]:checked');
                    const selectedMembers = Array.from(checkboxes).map(cb => cb.value);

                    if (!name) {
                        alert('グループ名を入力してください。');
                        return;
                    }

                    const myId = state.currentUserData.loginId;
                    const members = Array.from(new Set([myId, ...selectedMembers]));

                    if (members.length < 2) {
                        alert('自分以外のメンバーを少なくとも1名選んでください。');
                        return;
                    }

                    try {
                        const newRoomRef = db.collection('dms').doc();
                        await newRoomRef.set({
                            type: 'group',
                            name: name,
                            avatar: state.tempGroupAvatar || null,
                            members: members,
                            ownerId: myId,
                            createdAt: Date.now(),
                            lastMessage: 'グループが作成されました',
                            lastMessageTime: Date.now(),
                            lastSenderId: myId,
                            unread: false
                        });

                        state.isGroupModalOpen = false;
                        state.tempGroupAvatar = null;
                        alert('グループを作成しました！');
                        await fetchDMsOnce();
                        renderApp();
                    } catch (err) {
                        alert('グループ作成エラー: ' + err.message);
                    }
                };
            }

            document.querySelectorAll('[data-tab]').forEach(btn => {
                btn.onclick = () => {
                    state.currentTab = btn.getAttribute('data-tab');
                    renderApp();
                };
            });

            const addFriendForm = document.getElementById('addFriendForm');
            if (addFriendForm) {
                addFriendForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const targetId = document.getElementById('friendIdInput').value.trim();
                    if (!targetId || targetId === state.currentUserData.loginId) {
                        alert('有効なログインIDを入力してください。');
                        return;
                    }

                    const targetUser = state.allUsers.find(u => u.loginId === targetId);
                    if (!targetUser) {
                        alert('ユーザーが見つかりませんでした。');
                        return;
                    }

                    const myFriends = state.currentUserData.friends || [];
                    if (myFriends.includes(targetId)) {
                        alert('すでにフレンドです。');
                        return;
                    }

                    try {
                        const myDocId = state.currentUserData.id;
                        const targetDocId = targetUser.id;

                        if (myDocId && targetDocId) {
                            const myRef = db.collection('users').doc(myDocId);
                            const targetRef = db.collection('users').doc(targetDocId);

                            const newMyFriends = [...myFriends, targetId];
                            const targetFriends = targetUser.friends || [];
                            const newTargetFriends = [...targetFriends, state.currentUserData.loginId];

                            await myRef.update({ friends: newMyFriends });
                            await targetRef.update({ friends: newTargetFriends });

                            state.currentUserData.friends = newMyFriends;
                            targetUser.friends = newTargetFriends;

                            const roomId = getRoomId(state.currentUserData.loginId, targetId);
                            await db.collection('dms').doc(roomId).set({
                                type: 'dm',
                                members: [state.currentUserData.loginId, targetId],
                                createdAt: Date.now(),
                                lastMessage: '',
                                lastMessageTime: Date.now(),
                                lastSenderId: '',
                                unread: false
                            }, { merge: true });

                            alert('フレンドに追加しました！');
                            await fetchDMsOnce();
                            renderApp();
                        } else {
                            alert('ユーザー情報の更新に失敗しました。');
                        }
                    } catch (err) {
                        alert('エラー: ' + err.message);
                    }
                };
            }

            document.querySelectorAll('.start-chat-btn').forEach(btn => {
                btn.onclick = () => {
                    const targetLoginId = btn.getAttribute('data-start-chat');
                    const roomId = getRoomId(state.currentUserData.loginId, targetLoginId);
                    state.activeRoomId = roomId;
                    state.view = 'chat';
                    state.messages = [];
                    state.replyToMessage = null;
                    renderApp();
                };
            });

            document.querySelectorAll('#app .room-item').forEach(item => {
                item.onclick = async () => {
                    const roomId = item.getAttribute('data-room-id');
                    state.activeRoomId = roomId;
                    state.view = 'chat';
                    state.messages = [];
                    state.replyToMessage = null;
                    try {
                        await db.collection('dms').doc(roomId).update({ unread: false });
                    } catch(e){}
                    renderApp();
                };
            });

            // ★ 変更点③: トークピン留めの切り替えイベント
            document.querySelectorAll('.toggle-pin-room-btn').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const roomId = btn.getAttribute('data-toggle-pin-room');
                    const isCurrentlyPinned = btn.getAttribute('data-pinned') === 'true';

                    try {
                        await db.collection('dms').doc(roomId).set({
                            isPinned: !isCurrentlyPinned
                        }, { merge: true });

                        await fetchDMsOnce();
                        renderApp();
                    } catch (err) {
                        alert('ピン留めの更新に失敗しました: ' + err.message);
                    }
                };
            });

            // ★ 変更点②: 未読のまま見る（プレビュー）ボタンイベント
            document.querySelectorAll('.peek-room-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const roomId = btn.getAttribute('data-peek-room-id');
                    const roomName = btn.getAttribute('data-peek-name');

                    state.isPeekModalOpen = true;
                    state.peekRoomId = roomId;
                    state.peekRoomName = roomName;
                    renderApp();
                    fetchPeekMessages(roomId);
                };
            });

            const closePeekBtn = document.getElementById('closePeekModalBtn');
            const closePeekBtnBottom = document.getElementById('closePeekModalBtnBottom');
            if (closePeekBtn) closePeekBtn.onclick = () => { state.isPeekModalOpen = false; renderApp(); };
            if (closePeekBtnBottom) closePeekBtnBottom.onclick = () => { state.isPeekModalOpen = false; renderApp(); };

            const backToHomeBtn = document.getElementById('backToHomeBtn');
            if (backToHomeBtn) {
                backToHomeBtn.onclick = () => {
                    if (state.unsubscribeMessages) {
                        state.unsubscribeMessages();
                        state.unsubscribeMessages = null;
                    }
                    state.activeRoomId = null;
                    state.view = 'home';
                    state.replyToMessage = null;
                    fetchDMsOnce();
                    renderApp();
                };
            }

            const triggerAvatarBtn = document.getElementById('triggerAvatarBtn');
            const avatarFileInput = document.getElementById('avatarFileInput');
            if (triggerAvatarBtn && avatarFileInput) {
                triggerAvatarBtn.onclick = () => avatarFileInput.click();
                avatarFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        state.tempAvatar = await resizeImage(file, 150, 150, 0.8);
                        renderApp();
                    }
                };
            }

            const profileForm = document.getElementById('profileForm');
            if (profileForm) {
                profileForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const newName = document.getElementById('editNameInput').value.trim();
                    const updateData = { name: newName };
                    if (state.tempAvatar !== null) {
                        updateData.avatar = state.tempAvatar;
                    }

                    try {
                        const myDocId = state.currentUserData.id;
                        if (myDocId) {
                            await db.collection('users').doc(myDocId).update(updateData);
                            state.currentUserData.name = newName;
                            if (updateData.avatar) state.currentUserData.avatar = updateData.avatar;
                            state.tempAvatar = null;
                            alert('プロフィールを更新しました！');
                            state.view = 'home';
                            renderApp();
                        }
                    } catch (err) {
                        alert('エラー: ' + err.message);
                    }
                };
            }

            const triggerChatFileBtn = document.getElementById('triggerChatFileBtn');
            const chatFileInput = document.getElementById('chatFileInput');
            if (triggerChatFileBtn && chatFileInput) {
                triggerChatFileBtn.onclick = () => chatFileInput.click();
                chatFileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        let fileData;
                        if (file.type.startsWith('image/')) {
                            fileData = await resizeImage(file, 800, 800, 0.7);
                        } else {
                            fileData = await new Promise((res) => {
                                const r = new FileReader();
                                r.onload = (ev) => res(ev.target.result);
                                r.readAsDataURL(file);
                            });
                        }
                        state.selectedFile = { name: file.name, type: file.type, data: fileData };
                        renderApp();
                    }
                };
            }

            const cancelFileBtn = document.getElementById('cancelFileBtn');
            if (cancelFileBtn) {
                cancelFileBtn.onclick = () => {
                    state.selectedFile = null;
                    renderApp();
                };
            }

            const cancelReplyBtn = document.getElementById('cancelReplyBtn');
            if (cancelReplyBtn) {
                cancelReplyBtn.onclick = () => {
                    state.replyToMessage = null;
                    renderApp();
                };
            }

            const messageForm = document.getElementById('messageForm');
            if (messageForm) {
                messageForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const input = document.getElementById('messageInput');
                    const text = input.value.trim();
                    if (!text && !state.selectedFile) return;

                    const nowTimestamp = Date.now();
                    const msgData = {
                        senderId: state.currentUserData.loginId,
                        senderName: state.currentUserData.name,
                        text: text,
                        file: state.selectedFile,
                        replyTo: state.replyToMessage ? { name: state.replyToMessage.name, text: state.replyToMessage.text } : null,
                        createdAt: nowTimestamp,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        unsent: false,
                        readUsers: []
                    };

                    const roomId = state.activeRoomId;
                    input.value = '';
                    state.selectedFile = null;
                    state.replyToMessage = null;

                    try {
                        await db.collection('messages').doc(roomId).collection('chats').add(msgData);
                        await db.collection('dms').doc(roomId).set({
                            lastMessage: text || '[ファイル]',
                            lastMessageTime: nowTimestamp,
                            lastSenderId: state.currentUserData.loginId,
                            unread: true
                        }, { merge: true });
                    } catch (err) {
                        alert('送信エラー: ' + err.message);
                    }
                };
            }

            attachMessageActionEvents();
        }

        // ★ 変更点②: 未読を維持したままメッセージを取得・表示する関数
        async function fetchPeekMessages(roomId) {
            const container = document.getElementById('peekMessageContainer');
            if (!container) return;

            try {
                const snapshot = await db.collection('messages').doc(roomId).collection('chats')
                    .orderBy('createdAt', 'desc')
                    .limit(30)
                    .get();

                if (snapshot.empty) {
                    container.innerHTML = '<div class="text-center text-xs text-slate-400 py-6">メッセージがありません</div>';
                    return;
                }

                const msgs = snapshot.docs.map(doc => doc.data()).reverse();
                const myLoginId = state.currentUserData.loginId;

                container.innerHTML = msgs.map(m => {
                    const isSelf = m.senderId === myLoginId;
                    if (m.isSystem) {
                        return `<div class="text-center text-[11px] text-slate-400 py-1 font-mono">${escapeHtml(m.text)}</div>`;
                    }
                    if (m.unsent) {
                        return `<div class="flex ${isSelf ? 'justify-end' : 'justify-start'}"><div class="text-xs text-slate-400 italic bg-slate-200/50 dark:bg-slate-800 px-3 py-1.5 rounded-xl">送信取り消しされたメッセージ</div></div>`;
                    }
                    return `
                        <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
                            <span class="text-[10px] text-slate-400 mb-0.5 px-1">${escapeHtml(m.senderName)}</span>
                            <div class="px-3.5 py-2 rounded-2xl text-xs max-w-[80%] ${isSelf ? 'bg-blue-500 text-white rounded-br-none' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-bl-none border border-slate-100 dark:border-slate-700 shadow-sm'}">
                                ${m.text ? `<div>${escapeHtml(m.text)}</div>` : ''}
                                ${m.file ? `<div class="text-[11px] underline opacity-80 mt-0.5">[ファイル: ${escapeHtml(m.file.name)}]</div>` : ''}
                            </div>
                            <span class="text-[9px] text-slate-400 mt-0.5 px-1">${escapeHtml(m.time)}</span>
                        </div>
                    `;
                }).join('');
                
                container.scrollTop = container.scrollHeight;
                lucide.createIcons();
            } catch (err) {
                container.innerHTML = `<div class="text-center text-xs text-red-400 py-6">取得エラー: ${escapeHtml(err.message)}</div>`;
            }
        }

        // 初期描画実行
        renderApp();
    </script>
</body>
</html>
